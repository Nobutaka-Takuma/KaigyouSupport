[project]
name = "kaigyou-support"
version = "0.1.0"
description = "Location intelligence for dental clinic openings (Tokyo MVP)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "pyshp>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
kaigyou-etl = "kaigyou_etl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kaigyou_core", "kaigyou_etl", "kaigyou_etl.adapters", "kaigyou_api", "kaigyou_api.routers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
