[project]
name = "kaigyou-support"
version = "0.1.0"
description = "Location intelligence for dental clinic openings (Tokyo MVP)"
requires-python = ">=3.11"
# What serving a request needs, and nothing else. The serverless deployment
# installs exactly this: acquisition runs on a workstation, so httpx and pyshp
# have no business inside a function that only reads the database.
dependencies = [
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# openpyxl は e-Stat が xlsx で配る表（従業地・通学地集計など）用。
etl = ["httpx>=0.27", "pyshp>=2.3", "openpyxl>=3.1"]
serve = ["uvicorn[standard]>=0.32"]
dev = ["kaigyou-support[etl,serve]", "pytest>=8.0"]

[project.scripts]
kaigyou-etl = "kaigyou_etl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kaigyou_core", "kaigyou_etl", "kaigyou_etl.adapters", "kaigyou_api", "kaigyou_api.routers", "kaigyou_intel", "kaigyou_intel.steps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
