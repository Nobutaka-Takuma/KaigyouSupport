<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Dental Location Analyzer — 歯科開業候補地分析</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Shown until the application mounts, and removed by main.tsx when it
         does. A blank white page says nothing; twice now a deploy has served
         index.html while the JavaScript failed to load, and the only visible
         difference from a working page was the absence of everything. -->
    <div id="boot" style="font-family: system-ui, sans-serif; padding: 2rem;
                          color: #334155; line-height: 1.7;">
      読み込んでいます…
      <p style="font-size: 0.9rem; color: #64748b;">
        この表示が残る場合、JavaScript の読み込みに失敗しています。<br />
        Ctrl+Shift+R で再読み込みし、それでも変わらなければ開発者ツール（F12）の
        Console と Network を確認してください。
      </p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
