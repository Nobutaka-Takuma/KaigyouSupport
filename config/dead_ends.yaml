# 調べても答えの出ない問い。**毎回訊きにいかせないための台帳です。**
#
# ---------------------------------------------------------------------------
# なぜこれが要るのか
#
# 検索の上限は決まっています（config/analysis.yaml の max_searches_total）。
# 答えの無いところに使ったぶんは、**答えの出る問いに回りません。**
#
# 実測：沼津の分析で、次の問いが立ちました。
#
#   「沼津市内の歯科衛生士・歯科医師の年齢構成は」
#   「在宅療養支援歯科診療所の届出数、訪問診療の実施医院数は」
#
# どちらも公表されていません。**分かっているのに、分析のたびに検索して
# いました。** 一方、同じ分析で出た次の問いは当たりでした。
#
#   「復興土地区画整理事業中央工区の保留地の有無・住宅供給計画は、
#     将来推計人口の減少を緩和しうる規模か」
#
# 手元にある将来推計人口（減少）と、外部で見つけた区画整理事業（住宅供給）を
# 突き合わせ、**「推計はこの供給を織り込んでいる」という前提**を疑っています。
# これが良い問いです。前者は知識を増やし、後者は判断を変えます。
#
# ---------------------------------------------------------------------------
# これは「調べるな」ではありません
#
# 重要なのに調べられない問いは、**そのまま「開業前に現地で確かめること」に
# なります**（指示書 §56）。ここに載せるのは「検索に回さない」であって、
# 「無視する」ではありません。`researchability: low` として記録され、
# レポートの「確かめられなかったこと」に、確かめ方と一緒に出ます。
#
# ---------------------------------------------------------------------------
# 育て方
#
#   kaigyou-etl analyze --questions
#
# の最後に、実測から出た候補が並びます（何件のジョブで問いに立てて、何件で
# 答えが出なかったか）。**追加するかどうかは人が決めます。** 機械が勝手に
# 塞ぐと、あとから公表され始めたものに永久に気づけません。
#
# 書き方
#   topic     何が調べられないのか。**問いの文そのものではなく、種類**で
#   why       なぜ無いのか。「無いから」ではなく、どこを探して無いのか
#   instead   代わりに何をすれば分かるのか。空にしないでください
#   measured  実測で確かめた日付や件数（あれば）

dead_ends:
  - topic: 市区町村単位の歯科医師・歯科衛生士の年齢構成
    why: >-
      医師・歯科医師・薬剤師統計（厚生労働省）は**都道府県単位まで**です。
      市区町村別の年齢階級は公表されていません。歯科医師会の名簿にも
      年齢はありません。
    instead: >-
      都道府県単位の年齢構成は使えます。市区町村の事情を知りたいなら、
      医院の開設年（このデータセットにあります）を承継リスクの代理として
      読んでください。
    measured: 沼津・2026年の分析で検索し、回答不能

  - topic: 在宅療養支援歯科診療所の届出数・訪問診療の実施医院数
    why: >-
      施設基準の届出状況は地方厚生局が公表していますが、**公表の粒度と
      更新頻度が地域によって違い**、歯科の在宅療養支援診療所を市区町村別に
      数えられる形にはなっていません。
    instead: >-
      医院ごとの自由記載欄（このデータセットの標榜情報）に訪問診療の
      記載があれば、それは実施医院数の**下限**です。上限は分かりません。
    measured: 沼津・2026年の分析で検索し、回答不能

  - topic: 医院ごとの自由診療比率・診療単価・賃料負担
    why: 経営指標は非公開です。どの公的統計にもありません。
    instead: >-
      自費に振っているかどうかは、医院サイトの記載（インプラント・審美・
      矯正）で当たりを付けられます。比率までは分かりません。

  - topic: 患者の居住地別・勤務先別の内訳、通勤者の受診率
    why: >-
      患者調査（厚生労働省）は二次医療圏までで、歯科の通勤圏内受診率を
      市区町村別に出せる集計はありません。
    instead: >-
      昼間人口（従業地・通学地基準）と常住人口の差は使えます。**そのうち
      何割が受診するか**は、この分析では確定できません。

  - topic: 個別医院の経営方針・集患戦略・想定患者像
    why: 公表されていません。医院サイトの記載は方針の宣言であって実績ではありません。
    instead: 標榜科目・診療時間・立地から読める範囲にとどめてください。
