# ---------------------------------------------------------------------------
# 商圏インテリジェンス・エンジンの設定。
#
# モデル・上限・検索対象・プロンプト版をここに置きます。コードに書くと、
# 「なぜこの出力になったか」を後から追うのに git log を読む羽目になります。
# ---------------------------------------------------------------------------

version: 1

model:
  # 既定。ステップごとに上書きできます（下の steps: で `model:` を書けば
  # そのステップだけ別のモデルになります）。
  id: claude-sonnet-5
  # 推論の深さ。low / medium / high / xhigh / max。
  # 要件が求めているのは「専門家の思考プロセスの再現」なので、安いほうへ
  # 倒していません。効きが弱ければ xhigh を試してください。
  effort: high
  # 上限であって、目標ではありません。払うのは実際に出た分だけなので、上げても
  # 高くなりません。切り詰めて途中で切れると、そのステップは丸ごと作り直しです。
  #
  # adaptive thinking では思考も出力に数えられます（実測：STEP1 で 10,094）。
  # 実測：24,000 では STEP4 が書き終わる前に切れました（10章＋開業方針の
  # JSON で 18,741 文字まで出たところで停止）。全部ストリームで受けているので
  # HTTP タイムアウトの心配はなく、上限は余裕を持たせます。
  max_tokens: 64000

  # --- プロンプトキャッシュ ---------------------------------------------
  # 区切りはシステムプロンプトの末尾に置いています（kaigyou_intel/client.py）。
  # 以前はトップレベルの自動キャッシュでしたが、それは区切りを「最後の
  # キャッシュ可能なブロック」＝**地点ごとに変わる user メッセージ**に置くので、
  # 毎回書き込んで一度も読まない、いちばん損な形になっていました。
  #
  # **費用の話であって、速度の話ではありません。** キャッシュは出力の生成
  # 時間を縮めません。レポート1本の所要時間は思考と JSON の生成で決まります。
  #
  # 保持時間は既定の5分。5分は**応答の開始から**数えるので、レポート1本が
  # 12分かかるなら次の地点のころには消えています。何地点か続けて見るなら
  # 環境変数 KAIGYOU_CACHE_TTL=1h で1時間に延ばせますが、書き込みの単価が
  # 1.25倍から2倍に上がるので、当たらなければ損です。
  #
  # 参考: 1M トークンあたりの単価（入力 / 出力）
  #   claude-sonnet-5   $2  / $10
  #   claude-opus-5     $5  / $25
  #   claude-haiku-4-5  $1  / $5
  #
  # 実測（銀座4丁目・半径1km・Sonnet 5・effort: high）:
  #   STEP1  入力 38,230 tok / 出力 10,094 tok = $0.177
  # 出力は見積り（4,000）の2.5倍でした。effort: high の思考ぶんです。
  # 4ステップだとおおよそ $0.6〜0.9/レポート。effort を下げれば下がりますが、
  # 下げるかどうかは STEP4 の出来を見てから決めます。
  #
  # ステップごとに変えられます。たとえば STEP4（レポート生成）だけ Opus に
  # したい場合は、下の `4:` に `model: claude-opus-5` を足してください。

# 要件 §34。1レポートあたりの上限。
#
# **検索回数はそのまま実行時間です。** サーバ側の検索ループは 1 回の呼び出しの
# 中で回り、増えていく文脈を毎回読み直します。実測（裾野・半径1km）では 36 件の
# 資料を取得して、本文が根拠に引いたのは 7 件でした。29 件は読むためだけに
# 時間と金を使っています。上限を絞ると、モデルは「答えの出そうな問い」から
# 順に使うので、引かれる資料の割合はむしろ上がります。
limits:
  max_patterns: 4              # STEP1 が出す PATTERN の最大数
  searches_per_pattern: 2      # PATTERN あたりの Web 検索回数
  max_searches_total: 8
  # STEP2 を PATTERN ごとに分けて同時に走らせる本数。1 で直列（API の
  # レート制限に当たったときの逃げ道）。
  #
  # なぜ分けるか。1 本にまとめると、サーバ側の検索ループが 1 本の中で直列に
  # 回り、増えていく文脈を毎回読み直します。実測（沼津・4検索）で入力
  # 794,572 トークン・5分36秒。レポート1本 11分のうち、この段だけで半分を
  # 使っていました。調べる中身は PATTERN ごとに独立しているので、分けても
  # 答えは変わりません。変わるのは待ち時間で、直列の合計から**いちばん
  # 遅い1本**になります。
  parallel_research: 4
  max_clinics_in_projection: 20
  # 層を跨いだ PATTERN の下限は config/<業態>/hypotheses.yaml の crossing にあります。
  # 仮説の枠組み（層・定性要因・So What? のふるい）は 1 か所にまとめてあり、
  # こことあちらに分けて置くと、片方だけ直したときに食い違います。
  #
  # STEP2 に渡す競合医院の数（近い順）。自費診療の取り扱いを調べるための
  # 固有名詞で、これが無いと「インプラントの競合状況」は永久に分かりません。
  # 標榜診療科目にはインプラントが無く、届出には自由記載欄しかないためです。
  clinics_to_research: 6

  # STEP1 の周辺施設スキャンに使う検索回数。**0 でスキャンを止められます。**
  #
  # 止める口を残しているのは、これが唯一の「毎回必ず走る検索」だからです。
  # レート制限に当たったときや、外部に出られない環境で試すときに、設定
  # 1 行で切れないと段ごと落ちます。
  #
  # 2 回にしているのは、ここで欲しいのが**全体像**だからです。個々の施設を
  # 詰めるのは STEP2 の仕事で、あちらは PATTERN ごとに分かれて同時に走ります。
  # ここで丁寧に潰すと、そのぶんそのまま実行時間が伸びます（検索は 1 回の
  # 呼び出しの中で直列に回り、増えていく文脈を毎回読み直すため）。
  surroundings_searches: 2

# 要件 §9 の情報源優先順位。API 側で強制します（プロンプトでのお願いは
# 守られないことがあるので、守らせられるものは仕組みで守らせます）。
search:
  # 上から順に「望ましい」。source_type の分類にも使います。
  source_types:
    - { type: government,   label: "国・省庁",       domains: ["go.jp"] }
    - { type: statistics,   label: "政府統計",       domains: ["e-stat.go.jp", "stat.go.jp"] }
    - { type: prefecture,   label: "都道府県",       domains: ["pref.*.jp"] }
    - { type: municipality, label: "市区町村",       domains: ["city.*.jp", "town.*.jp", "vill.*.jp", "lg.jp"] }
    - { type: public_body,  label: "公的機関",       domains: ["or.jp"] }
    - { type: transit,      label: "交通事業者",     domains: [] }
    - { type: academic,     label: "大学・研究機関", domains: ["ac.jp"] }
    - { type: company,      label: "企業",           domains: ["co.jp"] }
    - { type: news,         label: "ニュース",       domains: [] }
    - { type: other,        label: "その他",         domains: [] }
  # 空なら制限なし。ここに列挙すると Anthropic 側で絞り込まれます。
  # 最初は絞らずに走らせ、実際に何が返るかを見てから決めることを勧めます。
  allowed_domains: []
  blocked_domains: []

# STEP1 に渡す範囲。
#
# 削る基準は「コストが高いもの」ではなく「発見に寄与しないもの」です。
# 医院20件の名前と住所は14KBありますが、パターン発見には効きません
# （効くのは competition.by_specialty と hours の集計のほう）。
#
# 逆に、母集団6つの比較は42.9KBありますが**これは削れません**。
# 「県内では上位45.7%だが市区町村内では下位2.4%」という食い違いこそが
# パターンで、代表の1つだけを渡すとその食い違いが見えなくなります。
projection:
  all_benchmarks: true     # 母集団6つの比較を全部渡す（prefecture / municipality / nearby ...）
  clinic_list: false       # 商圏内の医院一覧（名前・住所）
  station_list: true       # 商圏内の駅（路線・乗降客数）
  # 何も削らずデータセット全体を渡す。上の3つより優先されます。
  # 比較実験用。既定では使いません（成分の値が measures と二重になるため）。
  full_dataset: false

# ---------------------------------------------------------------------------
# worker の動かし方。
#
# 手元の PC で `analyze --poll` を回す使い方と、ホスティングされた関数を定期的に
# 叩く使い方の両方をします。後者では **1 呼び出し = 1 ステップ**です。
# 4 段が 1 回の関数呼び出しに収まらないことがあります（Vercel の実行時間上限は
# Hobby で 300 秒、Pro で 800 秒）。
# ---------------------------------------------------------------------------
worker:
  # 実行中のステップがこれ以上前に始まっていたら、途中で消えたものとみなして
  # 待ち行列に戻します。関数がタイムアウトすると必ず起きるので、必須です。
  #
  # 手元の worker 用。1 ステップの実測は最長でも 10 分前後なので、その倍。
  stale_after_minutes: 20

  # ホスティングされた関数用。**関数の実行時間の上限より少しだけ長く**します。
  # 上限を超えて生きているステップは存在し得ないので、それ以上待つのは
  # ただの空白です。手元の値（20分）をそのまま使っていたため、5分で死んだ
  # ステップに気づくまで15分かかっていました。画面には経過時間だけが
  # 増え続け、動いているように見えます。
  #
  # Hobby（300秒）なら 6分。Pro（800秒）なら 15分。
  hosted_stale_after_minutes: 15

  # 1 回の呼び出しで使ってよい秒数。vercel.json の maxDuration と合わせます。
  # ここを実際の上限より大きくすると、途中で殺される実行が増えます。
  invocation_seconds: 800

  # 次のステップに進んでよいか判断するための「1 ステップの最長の見込み」。
  #
  # 1 呼び出し 1 ステップだと、ステップの間に cron の間隔（最大60秒）が
  # まるごと空きます。4 段で最大4分、平均2分。ただ待っているだけの時間です。
  # 上限が 800秒 になったので、残り時間が足りるうちは続けて回します。
  #
  # 残り時間の判断にこの値を使います：`経過 + reserve < invocation` の間だけ
  # 次の段に進みます。**足りるか分からないなら進まない**、が原則です。途中で
  # 殺されるとそのステップは丸ごとやり直しで、時間も費用も倍かかります。
  #
  # ただし**大きすぎても損をします**。420 秒だと、800 秒の予算のうち 380 秒を
  # 使った時点で次に進めなくなり、ジョブは cron の次の呼び出し（最大60秒後）を
  # 待ちます。段の数だけその待ちが入ります。
  #
  # 段を 5 から 4 に減らし、機械的な段の effort を下げたので、1 段の見込みは
  # 短くなりました。実測が出たら、その最長に合わせて見直してください。
  # 段ごとの所要時間は `analyze --status` に出ます。
  reserve_seconds: 240

  # やり直す回数の上限（1回目を含む）。
  #
  # モデルの言い間違い（存在しない出典を書く、参照 id を取り違える、長さの上限で
  # JSON が途中で切れる）は一定の確率で起きます。1回で止めると、そのたびに人が
  # ボタンを押しに行くことになります。
  #
  # 何度やっても直らないもの（残高不足・キー不正・安全性の拒否）は、この回数に
  # 関係なく1回で止めます。判定は kaigyou_intel/failures.py にあります。
  max_attempts: 3

# レポートの書き出し先。STEP4 が終わったら黙って保存します。追加のコマンドを
# 打たないと現物が手に入らないのでは、「レポートを作る道具」として不完全です。
# 相対パスはリポジトリからの実行時のカレントディレクトリ基準です。
report:
  output_dir: reports

steps:
  1:
    name: 周辺施設スキャンと商圏特徴抽出
    # 2 回に分かれます。1 回目（prompt_surroundings）で**その場所に何が
    # あるのか**を検索し、2 回目（prompt）で基礎データと合わせて FACT と
    # PATTERN を作ります。
    #
    # なぜ検索を先に置くか。500m メッシュの統計は「そこに何人いるか」を
    # 教えますが、**「そこが何なのか」は教えません。** 大学のキャンパスも
    # ショッピングモールも総合病院も、統計の上では同じ「人がいる区画」です。
    # 同じ昼間人口5万人でも、商業施設のテナントなら商圏は徒歩圏ではなく
    # 施設の集客圏になり、半径1km の数字を別の意味に読み直すことになります。
    # 順番が逆では、この読み直しが起きたときには仮説が出来上がっています。
    prompt_surroundings: step1_surroundings.md
    prompt: step1_features.md
    prompt_version: step1-v1.10
    # 既に算出済みの順位とパーセンタイルから FACT を選び、食い違いを見つける
    # 段です。深く考えるより、たくさん見て取りこぼさないほうが効きます。
    # effort: high では思考だけで 10,094 トークン出ていました。
    effort: medium
    # 1 回目は検索が律速するので、待っている間の思考は増やしても待ち時間が
    # 伸びるだけです（STEP2 と同じ理由）。
    effort_scan: low
    # 要件 §6：Web検索禁止。**これは 2 回目（FACT と PATTERN を作る呼び出し）
    # の設定です。** 1 回目のスキャンは web_search=True を明示して呼びます。
    #
    # 禁止の理由は「FACT と EXTERNAL FACT の区別が最初の段階で壊れる」こと
    # でした。その区別は保っています。FACT が引けるのは measures と citable
    # のキーだけで、verify_step1 が機械的に検算します。スキャンの結果は
    # surroundings という別の欄に、出典 URL 付きで入ります。
    web_search: false
  2:
    name: 外部コンテクスト調査
    # Web検索と構造化出力は同じ呼び出しでは併用できないので、STEP2 は 2 回に
    # 分かれます。1 回目（prompt）で調べさせ、2 回目（prompt_structure）で
    # その本文を JSON に写させます。2 回目は検索を切ります。切らないと新しい
    # 事実が増えて、出典の照合が合わなくなります。
    prompt: step2_research.md
    prompt_structure: step2_structure.md
    prompt_version: step2-v1.6
    # 検索が律速する段で、待っている間の思考は増やしても意味がありません。
    effort: medium
    # 2 回目は**書き写すだけ**です。ここで考えさせると、調べていないことを
    # 補い始めます（そして出典の検算で落ちます）。
    effort_structure: low
    web_search: true
  3:
    name: 需要形成・患者分析と経営判断
    prompt: step3_demand.md
    prompt_version: step3-v1.5
    # ここが判断の段です。**深く考えるだけの価値があるのはここと STEP4 だけ**
    # なので、下げません。
    effort: high
    web_search: false
  4:
    # STEP3 までは根拠を辿れる形（タグと id）で作ります。それは検算のための
    # 形であって、人が読むための形ではありません。顧客に渡す文書はここで
    # 起こし直します。書き直しであって、書き足しではありません。
    name: 顧客提出用レポート
    prompt: step4_client_report.md
    prompt_version: step4-v1.4
    effort: high
    # 要件 §16：新しい外部事実を追加しない。
    web_search: false
