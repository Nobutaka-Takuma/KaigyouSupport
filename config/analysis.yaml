# ---------------------------------------------------------------------------
# 商圏インテリジェンス・エンジンの設定。
#
# モデル・上限・検索対象・プロンプト版をここに置きます。コードに書くと、
# 「なぜこの出力になったか」を後から追うのに git log を読む羽目になります。
# ---------------------------------------------------------------------------

version: 1

model:
  # 既定。ステップごとに上書きできます（下の steps: で `model:` を書けば
  # そのステップだけ別のモデルになります）。
  id: claude-sonnet-5
  # 推論の深さ。low / medium / high / xhigh / max。
  # 要件が求めているのは「専門家の思考プロセスの再現」なので、安いほうへ
  # 倒していません。効きが弱ければ xhigh を試してください。
  effort: high
  # 上限であって、目標ではありません。払うのは実際に出た分だけなので、上げても
  # 高くなりません。切り詰めて途中で切れると、そのステップは丸ごと作り直しです。
  #
  # adaptive thinking では思考も出力に数えられます（実測：STEP1 で 10,094）。
  # 実測：24,000 では STEP4 が書き終わる前に切れました（10章＋開業方針の
  # JSON で 18,741 文字まで出たところで停止）。全部ストリームで受けているので
  # HTTP タイムアウトの心配はなく、上限は余裕を持たせます。
  max_tokens: 64000

  # 参考: 1M トークンあたりの単価（入力 / 出力）
  #   claude-sonnet-5   $2  / $10
  #   claude-opus-5     $5  / $25
  #   claude-haiku-4-5  $1  / $5
  #
  # 実測（銀座4丁目・半径1km・Sonnet 5・effort: high）:
  #   STEP1  入力 38,230 tok / 出力 10,094 tok = $0.177
  # 出力は見積り（4,000）の2.5倍でした。effort: high の思考ぶんです。
  # 4ステップだとおおよそ $0.6〜0.9/レポート。effort を下げれば下がりますが、
  # 下げるかどうかは STEP4 の出来を見てから決めます。
  #
  # ステップごとに変えられます。たとえば STEP4（レポート生成）だけ Opus に
  # したい場合は、下の `4:` に `model: claude-opus-5` を足してください。

# 要件 §34。1レポートあたりの上限。
limits:
  max_patterns: 5              # STEP1 が出す PATTERN の最大数
  searches_per_pattern: 3      # PATTERN あたりの Web 検索回数
  max_searches_total: 15
  max_clinics_in_projection: 20

# 要件 §9 の情報源優先順位。API 側で強制します（プロンプトでのお願いは
# 守られないことがあるので、守らせられるものは仕組みで守らせます）。
search:
  # 上から順に「望ましい」。source_type の分類にも使います。
  source_types:
    - { type: government,   label: "国・省庁",       domains: ["go.jp"] }
    - { type: statistics,   label: "政府統計",       domains: ["e-stat.go.jp", "stat.go.jp"] }
    - { type: prefecture,   label: "都道府県",       domains: ["pref.*.jp"] }
    - { type: municipality, label: "市区町村",       domains: ["city.*.jp", "town.*.jp", "vill.*.jp", "lg.jp"] }
    - { type: public_body,  label: "公的機関",       domains: ["or.jp"] }
    - { type: transit,      label: "交通事業者",     domains: [] }
    - { type: academic,     label: "大学・研究機関", domains: ["ac.jp"] }
    - { type: company,      label: "企業",           domains: ["co.jp"] }
    - { type: news,         label: "ニュース",       domains: [] }
    - { type: other,        label: "その他",         domains: [] }
  # 空なら制限なし。ここに列挙すると Anthropic 側で絞り込まれます。
  # 最初は絞らずに走らせ、実際に何が返るかを見てから決めることを勧めます。
  allowed_domains: []
  blocked_domains: []

# STEP1 に渡す範囲。
#
# 削る基準は「コストが高いもの」ではなく「発見に寄与しないもの」です。
# 医院20件の名前と住所は14KBありますが、パターン発見には効きません
# （効くのは competition.by_specialty と hours の集計のほう）。
#
# 逆に、母集団6つの比較は42.9KBありますが**これは削れません**。
# 「県内では上位45.7%だが市区町村内では下位2.4%」という食い違いこそが
# パターンで、代表の1つだけを渡すとその食い違いが見えなくなります。
projection:
  all_benchmarks: true     # 母集団6つの比較を全部渡す（prefecture / municipality / nearby ...）
  clinic_list: false       # 商圏内の医院一覧（名前・住所）
  station_list: true       # 商圏内の駅（路線・乗降客数）
  # 何も削らずデータセット全体を渡す。上の3つより優先されます。
  # 比較実験用。既定では使いません（成分の値が measures と二重になるため）。
  full_dataset: false

# ---------------------------------------------------------------------------
# worker の動かし方。
#
# 手元の PC で `analyze --poll` を回す使い方と、ホスティングされた関数を定期的に
# 叩く使い方の両方をします。後者では **1 呼び出し = 1 ステップ**です。
# 5 段を 1 回の関数呼び出しには収められません（Vercel の実行時間上限は
# Hobby で 300 秒、Pro で 800 秒。分析は通しで 10〜20 分）。
# ---------------------------------------------------------------------------
worker:
  # 実行中のステップがこれ以上前に始まっていたら、途中で消えたものとみなして
  # 待ち行列に戻します。関数がタイムアウトすると必ず起きるので、必須です。
  #
  # 手元の worker 用。1 ステップの実測は最長でも 10 分前後なので、その倍。
  stale_after_minutes: 20

  # ホスティングされた関数用。**関数の実行時間の上限より少しだけ長く**します。
  # 上限を超えて生きているステップは存在し得ないので、それ以上待つのは
  # ただの空白です。手元の値（20分）をそのまま使っていたため、5分で死んだ
  # ステップに気づくまで15分かかっていました。画面には経過時間だけが
  # 増え続け、動いているように見えます。
  #
  # Hobby は 300秒 なので 6分。Pro（800秒）に上げたら 15 にしてください。
  hosted_stale_after_minutes: 6

  # やり直す回数の上限（1回目を含む）。
  #
  # モデルの言い間違い（存在しない出典を書く、参照 id を取り違える、長さの上限で
  # JSON が途中で切れる）は一定の確率で起きます。1回で止めると、そのたびに人が
  # ボタンを押しに行くことになります。
  #
  # 何度やっても直らないもの（残高不足・キー不正・安全性の拒否）は、この回数に
  # 関係なく1回で止めます。判定は kaigyou_intel/failures.py にあります。
  max_attempts: 3

# レポートの書き出し先。STEP4 が終わったら黙って保存します。追加のコマンドを
# 打たないと現物が手に入らないのでは、「レポートを作る道具」として不完全です。
# 相対パスはリポジトリからの実行時のカレントディレクトリ基準です。
report:
  output_dir: reports

steps:
  1:
    name: 商圏特徴抽出
    prompt: step1_features.md
    prompt_version: step1-v1.2
    # 要件 §6：Web検索禁止。ここで外部情報が混ざると、FACT と
    # EXTERNAL FACT の区別が最初の段階で壊れます。
    web_search: false
  2:
    name: 外部コンテクスト調査
    # Web検索と構造化出力は同じ呼び出しでは併用できないので、STEP2 は 2 回に
    # 分かれます。1 回目（prompt）で調べさせ、2 回目（prompt_structure）で
    # その本文を JSON に写させます。2 回目は検索を切ります。切らないと新しい
    # 事実が増えて、出典の照合が合わなくなります。
    prompt: step2_research.md
    prompt_structure: step2_structure.md
    prompt_version: step2-v1.1
    web_search: true
  3:
    name: 需要形成・患者分析
    prompt: step3_demand.md
    prompt_version: step3-v1.0
    web_search: false
  4:
    name: 経営判断
    prompt: step4_strategy.md
    prompt_version: step4-v1.0
    # 要件 §16：STEP4 では新しい外部事実を追加しない。
    web_search: false
  5:
    # STEP4 までは根拠を辿れる形（タグと id）で作ります。それは検算のための
    # 形であって、人が読むための形ではありません。顧客に渡す文書はここで
    # 起こし直します。書き直しであって、書き足しではありません。
    name: 顧客提出用レポート
    prompt: step5_client_report.md
    prompt_version: step5-v1.0
    web_search: false
