# ---------------------------------------------------------------------------
# 仮説の枠組み。
#
# **なぜ設定に置くのか。** ここに書いてあるのは統計ではなく、歯科の開業で
# 何が成否を分けるかについての**業界知識**です。データから出てくるものでは
# ないので、モデルに思いつかせるより、枠として与えたほうが確実です。
# そしてそれは、統計のように「正しい/正しくない」が決まっているものでは
# なく、扱う人が入れ替えるものなので、コードではなく設定に置きます。
#
# **ここに書いた事柄を、事実として出力してはいけません。** これは調べる
# 対象の一覧であって、答えではありません。「この地域はデンタルIQが高い」は
# 統計にも外部資料にも無いので、書けるのは仮説（H###）としてだけです。
# ---------------------------------------------------------------------------

version: 1

# 層。数字は層ごとに分かれていて、**別々の層を掛け合わせたときにだけ構造が
# 見えます**。層そのものの定義は kaigyou_core/measures.py の LAYERS にあり
# （指標のすぐ隣に置かないと、指標を足したときに片方だけ古くなるため）、
# ここではその使い方だけを書きます。
crossing:
  # 層を跨いだ PATTERN を最低いくつ求めるか。0 で無効。
  #
  # 実測：レポートが「人口が市内2位」「医院数も市内2位」を並べて終わって
  # いました。どちらも同じ商圏の大きさを別の言葉で言っただけです。
  #
  # 上げすぎると、無い矛盾を作り始めます。max_patterns が 4 のとき 3 が
  # 上限の目安です。落ちるとその段はやり直しになるので、費用も増えます。
  min_cross_layer_patterns: 3

  # 特に見てほしい掛け合わせ。プロンプトに例として渡します。**これに限る
  # という意味ではありません。**
  examples:
    - "人口動態 × 競合の提供体制：高齢化が進むのに、日曜・夜間に開けている医院が少ない"
    - "産業・雇用 × 競合の提供体制：昼間人口が多いのに、平日夜間の受け皿が薄い"
    - "地価・コスト × 競合の提供体制：地価が高いのに、自費に振った医院が見当たらない"
    - "将来推計 × 競合の数：小児人口は半減するのに、小児歯科の標榜が厚い"
    - "競合の提供体制 × 競合の数：医院数は多いが、開設から30年以上の医院が半数を占める"

# 歯科経営の定性要因（KSF）。統計には載らないが、開業の成否を左右するもの。
#
# それぞれについて、
#   question  何を知りたいのか
#   proxies   手元にある代理指標（citable / measures のキー）
#   research  外部で調べる価値があること
#   changes   分かったときに何が変わるか
# を書きます。``proxies`` が空の要因は、**手元のデータでは何も言えません**。
# その場合でも仮説としては立てられますが、根拠は外部資料に限られます。
factors:

  - id: dental_iq
    name: 世帯のデンタルIQ・自費許容度
    question: >-
      この商圏の住民は、保険外の治療にお金を払うか。予防で定期的に通うか。
      同じ人口でも、自費の比率が違えば成り立つ医院モデルが変わります。
    # 所得も学歴もメッシュ統計には無いので、代理はどれも弱い。弱いことを
    # 書いておかないと、強い根拠として使われます。
    proxies:
      - key: land_price_yen_per_sqm
        why: 地価は世帯の支払い能力の弱い代理。住宅地の地価が高い＝住民の所得が高い、とは限りません
      - key: clinic_hours.weekly_hours_median
        why: 週間診療時間が短い医院が多い商圏は、自費中心の可能性がある（保険診療は数をこなす必要がある）
      - key: clinic_specialty.orthodontics
        why: 矯正の標榜は自費需要が成立している傍証。ただし標榜は看板であって実績ではありません
    research:
      - "市区町村の国民健康保険・特定健診の受診率、歯科健診の受診率"
      - "市区町村の課税対象所得（市町村税課税状況等の調）"
      - "近隣医院の公式サイトにおける自費メニューの厚み（インプラント・矯正・審美）"
    changes: [診療コンセプト, 設備投資, 患者層]

  - id: succession
    name: 競合院の設備老朽化・院長世代交代リスク
    question: >-
      20年後の競合の数は、いまの数ではなく「いまの院長があと何年やるか」で
      決まります。開設から30年経った医院が多い商圏は、これから供給が減る
      可能性がある。逆に最近の開設が続く商圏は、これから増えます。
    proxies:
      - key: clinic_vintage.median_year
        why: 開設年の中央値。**院長の年齢ではありません**（承継も分院も開設は新しいまま）
      - key: clinic_vintage.opened_long_ago
        why: 開設から30年以上経つ医院の数。開設者がそのまま院長なら還暦前後
      - key: clinic_vintage.opened_recently
        why: 直近5年の開設。いまこの商圏に参入が起きているか
    research:
      - "都道府県の歯科医師数・年齢構成（衛生行政報告例、医師・歯科医師・薬剤師統計）"
      - "近隣医院の公式サイトにおける院長の経歴・開院年・承継の記載"
      - "歯科医院の廃止・休止の届出状況（都道府県の医療機関一覧の更新履歴）"
    changes: [立地判断, 設備投資, 患者層]

  - id: staffing
    name: 日曜・夜間稼働を支える人材供給力
    question: >-
      「日曜に開ければ空白を取れる」は、日曜に働く歯科衛生士と受付を
      雇えて初めて成立します。雇えない商圏でその方針を立てると、
      レポートは実行できない案を勧めたことになります。
    proxies:
      - key: clinic_hours.sunday
        why: 実際に日曜に開けている医院の数。少ないのは需要が無いからか、人が採れないからか
      - key: clinic_hours.evening
        why: 夜間の受け皿。日曜より採用のハードルが低いので、これも少ないなら人の問題の可能性
      - key: station_distance_m
        why: 通勤のしやすさ。駅から遠い医院は、スタッフの採用範囲が狭くなります
    research:
      - "都道府県の歯科衛生士の就業者数・人口比（衛生行政報告例）"
      - "近隣の歯科衛生士養成校の所在と定員"
      - "市区町村の有効求人倍率（職業別が取れるなら医療・福祉）"
    changes: [診療時間, 人員体制, 診療コンセプト]

# 仮説のふるい（So What?）。
#
# 思いつきの仮説を排除します。「この地域は高齢化している」は仮説ですらなく
# 統計の言い換えですが、「高齢化しているが訪問診療の届出が無い」も、それだけ
# では**次の一手が変わりません**。変わるものだけを残します。
screening:
  # 仮説が正しかったとき、何が変わりうるか。Hypothesis.changes の選択肢です。
  # スキーマ（kaigyou_intel/schemas.py の DecisionLever）と同じ順で並べます。
  levers:
    - 診療コンセプト   # 何を売る医院にするか（一般／小児／矯正／自費／訪問）
    - 設備投資        # ユニット数・CT・個室・バリアフリー・訪問車両
    - 診療時間        # 何曜日の何時に開けるか
    - 人員体制        # 常勤何人、交代制を組むか
    - 立地判断        # そもそもここで開業するか、半径をどう取るか
    - 患者層          # 誰を主要に置くか
  # 1 つの仮説が変えうるレバーの最低数。0 にすると、ふるいが効きません。
  min_levers: 1
