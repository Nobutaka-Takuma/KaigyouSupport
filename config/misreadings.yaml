# この画面の数字で、やってはいけない読み方。
#
# **これは注意書きの寄せ集めではなく、この製品の中身です。**
#
# jSTAT MAP も RESAS も TerraMap も、正しい数字を出します。間違えるのは
# 読む側です。そしてツールは黙って通します——だから誰も「不便だ」と言わず、
# 気づかないまま自信を持ちます。
#
# 実測（この開発中に踏んだもの）：国勢調査の「在学者数」メッシュで西早稲田
# キャンパスを引くと 169 人でした。実際にそのキャンパスに通う学生は 3,000 人
# 規模です。**18 倍違います。** 在学者数が常住地基準——「そこに住んでいる
# 学生」を数えていて、「そこに通ってくる学生」ではないからです。
#
# 画面とレポートが同じ文を使います。片方だけ直すと、地図で見た注意と
# レポートに書いてある注意が食い違います。
#
# ---------------------------------------------------------------------------
# 書き方
#
#   id          安定した識別子。画面が並び順や既読を持つときに使う
#   trap        誤読そのもの。「〜と読む」の形で書く
#   why         なぜ間違いなのか。**根拠のある1〜2文で**
#   instead     ではどう読むのか
#   severity    high  = 判断がひっくり返る
#               medium= 見積もりが大きくずれる
#   categories  その業態でだけ意味を持つものに書く。省略すると全業態
#   applies_to  関係する指標キーやレイヤ。画面がその数字の近くに出すために使う

misreadings:
  # ------------------------------------------------- 人数の数え方（最も多い）
  - id: mixing_population_bases
    trap: 常住人口・従業者数・昼間人口を足す
    why: >-
      3 つは別々の調査の別々の基準です。常住人口は国勢調査の常住地基準
      （そこに住んでいる人）、従業者数は経済センサスの従業地基準
      （そこで働いている人）、昼間人口は国勢調査の従業地・通学地基準
      （そこに来る人）。同じ人が複数に数えられます。
    instead: >-
      商圏の「のべ人数」は作れません。どの基準の数字なのかを言ったうえで、
      基準ごとに読んでください。
    severity: high
    applies_to: [population, workers, daytime_population]

  - id: workers_as_daytime
    trap: 経済センサスの「従業者数」を昼間人口として読む
    why: >-
      従業者数には**通学者が含まれません**。大学や専門学校の門前では、
      そこにいる人の大半が従業者数に現れないことがあります。
    instead: >-
      通学者まで数えたいときは、国勢調査の従業地・通学地集計（昼間人口）を
      見てください。この分析では別の欄に出しています。
    severity: high
    applies_to: [workers, daytime_population]

  - id: students_are_residents
    trap: 国勢調査の「在学者数」を、そこに通っている学生の数として読む
    why: >-
      在学者数は**常住地基準**です。「そこに住んでいる学生」を数えていて、
      「そこに通ってくる学生」ではありません。実測：西早稲田キャンパスの
      メッシュは 169 人でしたが、実際に通う学生は 3,000 人規模です。
    instead: >-
      通学者の数は従業地・通学地集計にあります。ただし市区町村単位までで、
      メッシュはありません。1km 圏の通学者は、この分析では確定できません。
    severity: high
    applies_to: [schooling, daytime_population]

  - id: daytime_excludes_visitors
    trap: 昼間人口を「その時間そこにいる人の数」として読む
    why: >-
      昼間人口に**来街者（買い物・観光）は含まれません**。通勤・通学で来る人
      だけです。繁華街の来街需要は、どちらの調査でも捉えられていません。
    instead: >-
      買い物客の多い立地では、昼間人口は下限にすぎません。人流データが要ります。
    severity: medium
    applies_to: [daytime_population]

  # ------------------------------------------------- コスト
  - id: land_price_as_rent
    trap: 地価を賃料として読む
    why: >-
      地価は土地の価格で、賃料ではありません。この分析は想定利回りで機械的に
      換算していますが、建物の状態・階数・契約条件・実際の募集事例を一切
      含んでいません。
    instead: >-
      粗い目安としてのみ。個別物件の賃料や初期投資額の代わりには使えません。
    severity: high
    applies_to: [land_price_yen_per_sqm, rent_estimate]

  - id: land_price_as_income
    trap: 地価が高いことを、住民の所得が高いこと（自費が通ること）の根拠にする
    why: >-
      地価は世帯の支払い能力の弱い代理指標です。商業地は地価が高くても
      そこに住む人は少なく、住宅地の地価は交通利便性で決まります。
    instead: >-
      「地価は上位 15% だが、自費に振った医院が見当たらない。ここは調べる
      価値がある」までは書けます。所得の代わりにはできません。
    severity: high
    applies_to: [land_price_yen_per_sqm]

  # ------------------------------------------------- 競合（歯科）
  - id: specialty_as_practice
    trap: 標榜診療科目を、実際に診ている内容として読む
    why: >-
      標榜は届出値です。「小児歯科」を標榜していても小児を主に診ているとは
      限らず、標榜していなくても小児を診ている医院はあります。
    instead: 看板の数であって、診療内容の数ではありません。
    severity: medium
    categories: [dental_clinic]
    applies_to: [clinic_specialty]

  - id: free_text_as_count
    trap: インプラント・審美・訪問診療の件数を、実施医院数として読む
    why: >-
      これらは標榜科目ではなく自由記載欄にしかありません。記載率が低く
      （東京都でインプラントの記載は 1% 台）、書いた医院しか数えられません。
    instead: >-
      実施医院数の**下限**です。競合の少なさの根拠には使えません。
    severity: high
    categories: [dental_clinic]
    applies_to: [clinic_specialty]

  - id: clinic_count_as_capacity
    trap: 医院数の少なさを、需要が余っていることとして読む
    why: >-
      医院数は施設の数で、ユニット数でも診療実績でもありません。1 院が
      10 ユニットで回している商圏と、3 院が各 2 ユニットの商圏では、
      医院数の多い後者のほうが供給は少ないことがあります。
    instead: >-
      医院数と人口の比は入口の指標です。規模までは分かりません。
    severity: medium
    applies_to: [dental_clinics, population_per_clinic]

  # ------------------------------------------------- 面と点
  - id: score_as_prediction
    trap: スコアを開業の成否・売上・患者数の予測として読む
    why: >-
      スコアは同一都道府県内のメッシュ分布に対する相対値です。暫定モデルで、
      実績データによる較正を行っていません。都道府県をまたぐ比較もできません。
    instead: >-
      同じ県の中で候補地を並べ替えるための順位です。それ以上の意味はありません。
    severity: high
    applies_to: [score, overall_score]

  - id: circle_as_catchment
    trap: 半径の円を、実際に人が来る範囲として読む
    why: >-
      円は直線距離です。川・線路・幹線道路の向こう側は、距離が近くても
      歩いて来られません。実測（試験用の網、半径 500m）：円 0.78km² に対し
      徒歩圏 0.29km²。
    instead: 「商圏の形」を徒歩圏（街路網）に切り替えると、街路に沿った範囲になります。
    severity: medium
    applies_to: [catchment]

  - id: pin_as_parcel
    trap: 地図に打ったピンを、その物件そのものとして読む
    why: >-
      ピンは座標で、区画ではありません。商業施設の敷地の中なのか、隣接する
      別区画なのかは、この分析では判定していません。
    instead: >-
      建物単位の判断（テナントとして入れるか、面積はいくつか）は、
      現地と物件資料でしか確かめられません。
    severity: medium
    applies_to: [catchment, regulation]

  - id: zoning_as_permission
    trap: 用途地域の判定を、建てられるという許可として読む
    why: >-
      公表値による一次判定です。実際の可否は規模・接道・条例・特定行政庁の
      判断で変わります。
    instead: 一次スクリーニングにのみ。建築確認や事前相談の代わりにはなりません。
    severity: high
    applies_to: [regulation]

  # ------------------------------------------------- 時点
  - id: mesh_is_current
    trap: メッシュ統計を現在の数字として読む
    why: >-
      国勢調査は 5 年ごとです。この分析が使っているのは 2020 年で、
      直近の動向とは異なる場合があります。人口増減率は 2015→2020 の変化です。
    instead: 5 年前の断面として読み、直近の変化は別に確かめてください。
    severity: medium
    applies_to: [population, population_growth]

  - id: secrecy_shifts_small_meshes
    trap: 1 メッシュの値をその区画の実数として読む
    why: >-
      国勢調査メッシュは秘匿処理により、小規模メッシュの値が隣接メッシュへ
      合算されています。合計は保たれますが、局所的に 1 メッシュ分ずれます。
    instead: 商圏全体の合計は使えます。1 メッシュ単位の断定は避けてください。
    severity: medium
    applies_to: [population]
