# ---------------------------------------------------------------------------
# Scoring configuration.
#
# These weights are HYPOTHESES, not calibrated coefficients. Nothing here is
# derived from observed clinic outcomes, and the app labels every score as a
# provisional model. Edit this file (or add a profile) to change the model --
# no code change is required, and the API reloads it when the file's mtime
# changes.
#
# Select a profile per request:  /api/candidate-analysis?...&profile=default
# ---------------------------------------------------------------------------

active_profile: default

# How a raw metric is mapped onto 0-100 before weighting.
#   minmax_p05_p95 : linear between the 5th and 95th percentile of the
#                    observed mesh distribution, clamped. Robust to outliers.
#   zscore         : mean/stddev, mapped so mean -> 50 and +2sd -> 100.
normalization:
  method: minmax_p05_p95
  clamp: [0, 100]
  # A component is withheld unless at least this share of its weight is backed
  # by data actually present. Prevents a "demand" score resting on one input.
  min_weight_coverage: 0.5

  # --- 目盛りを、どの集合から作るか -------------------------------------
  #
  #   with_clinics  歯科医院が実在する商圏だけ（既定）
  #   all           人口のある商圏すべて
  #
  # 人口の少ない県では、これが最も効きます。県全域を目盛りにすると、
  # メッシュの大半が農村なので p95 が市街地の下限より低いところに来て、
  # **市街地はどこでも上限に張り付きます**。合成した農村県で測ると、
  # 人口が 30,737〜70,792 人（2.3倍）ある市街地 24 件が、全部ちょうど
  # 100 点になりました。「どこにピンを置いても Demand 90 以上」の正体です。
  #
  # 目盛りを「歯科医院が実在する商圏」から作ると、同じ 24 件が
  # 53.6〜100 点に散ります。開業地を選ぶ人が比べたいのは候補地どうしで、
  # 山林と比べたいわけではないので、そちらが本来の目盛りです。
  #
  # 東京のような人口の多い県ではほとんど動きません（候補地が全体の84%を
  # 占めるため、100点への張り付きが6%から5%になる程度）。
  #
  # この値は metric_distributions の scope 鍵に入ります。変更すると
  # 既存の目盛りとは別物として扱われ、refresh-stats の再実行が必要になります
  # （古い目盛りを新しい意味で黙って使わせないため）。
  reference: with_clinics

  # 候補地がこれ未満しかない県では、目盛りを作れないので all に戻します。
  # 戻したことは refresh-stats の出力と API の応答に出ます。
  min_reference_sample: 50

profiles:

  default:
    label: "標準（暫定モデル）"
    description: "要件定義書 11〜15章の暫定重み。実績データによる較正は行っていない。"

    # --- Overall -----------------------------------------------------------
    overall_weights:
      demand: 0.35
      competition: 0.30
      growth: 0.20
      accessibility: 0.15

    # --- Demand ------------------------------------------------------------
    # Each component is normalised independently, then weighted.
    # `workers` is 従業者数 from the economic census -- people at their place of
    # work. It is deliberately not added to `population`: a commuter is one
    # person who may visit a dentist near work or near home, not two people, so
    # summing them would double-count. Giving it its own weight says how much a
    # daytime head is worth relative to a resident one, which is the actual
    # question, and leaves it adjustable without touching code.
    demand_weights:
      population: 0.28
      workers: 0.20
      age_0_14: 0.12
      age_65_plus: 0.12
      households: 0.16
      population_growth: 0.12

    # --- Competition -------------------------------------------------------
    # Base metric: catchment population per facility. Higher = fewer clinics
    # relative to population.
    competition:
      metric: population_per_facility
      # With zero facilities in the catchment the ratio is undefined. Rather
      # than dividing by zero we award the capped score below -- but only if
      # there is any population at all to serve.
      zero_facility_score: 95
      zero_population_score: 0
      # Ignore the percentile scale above this ratio (people per clinic).
      cap: 20000

    # --- Growth ------------------------------------------------------------
    growth:
      metric: population_growth
      # Fractional change over the source's comparison interval (2015->2020)
      # that maps to the bottom and top of the scale. Set from the observed
      # spread of Tokyo 500m meshes with 100+ residents: p10 = -7.6%,
      # p90 = +11.4%. Small meshes swing hard, so the tails are clipped.
      low: -0.08    #  -8%  -> 0
      high: 0.12    # +12%  -> 100

    # --- Accessibility -----------------------------------------------------
    accessibility:
      weights:
        station_distance: 0.6
        daily_passengers: 0.4
      # Distance to the nearest station, metres. Nearer is better.
      distance_best_m: 200      # <= 200m -> 100
      distance_worst_m: 2000    # >= 2km  -> 0
      # Daily boardings+alightings at that station. Log-scaled because the
      # distribution spans three orders of magnitude.
      passengers_scale: log10
      passengers_min: 1000      # -> 0
      passengers_max: 500000    # -> 100

  # 小児歯科寄りの仮説。需要側で 0〜14 歳を重く見るだけでなく、競合も
  # 「小児歯科を標榜している医院」だけを数えます。
  #
  # 標榜科目データ（医療情報ネット 032）を入れるまでは、このプロファイルは
  # 子どもの人口を重く見ながら競合は歯科医院すべてで数えていました。小児歯科を
  # やろうとしている人にとって、小児歯科を標榜していない医院は同じ重さの競合
  # ではないので、そこだけ噛み合っていませんでした。
  #
  # 分母も人口総数から 0〜14 歳人口に変えています。「小児歯科 1 件あたりの
  # 子どもの数」が、この仮説で見たい比率そのものだからです。
  pediatric:
    label: "小児歯科寄り（暫定モデル）"
    description: "0〜14歳人口と世帯数を重視し、競合を小児歯科の標榜医院に限定した仮説重み。"
    overall_weights:
      demand: 0.40
      competition: 0.30
      growth: 0.20
      accessibility: 0.10
    demand_weights:
      population: 0.20
      workers: 0.05        # children do not commute to offices
      age_0_14: 0.38
      age_65_plus: 0.05
      households: 0.17
      population_growth: 0.15
    competition:
      # 標榜科目で競合を絞る。キーは config/sources.yaml の specialty_codes に
      # あるもの（general / pediatric / orthodontics / oral_surgery /
      # pediatric_orthodontics）だけを使ってください。インプラントや審美は
      # 自由記載欄にしか現れず、書いた医院しか数えられないので、競合の
      # 少なさの根拠には使えません（数え落としが一方向にしか起きない）。
      specialty: pediatric
      # 比率の分子。小児歯科 1 件あたりの 0〜14 歳人口。
      population_metric: age_0_14
      metric: population_per_facility
      # 商圏内の歯科医院のうち、診療科目が分かっているものの割合の下限。
      # 下回るときは算出しません。載っていない医院は「標榜していない」のでは
      # なく「分からない」ので、そのまま数えると競合が少ない土地に見えます。
      min_specialty_coverage: 0.8
      zero_facility_score: 95
      zero_population_score: 0
      # 分母が 0〜14 歳人口なので、人口総数のときの 20,000 とは桁が違います。
      # 東京都の 1km 商圏の中央値はおよそ 1,300 人／小児歯科 1 件。
      cap: 6000
    growth:
      metric: population_growth
      low: -0.08
      high: 0.12
    accessibility:
      weights:
        station_distance: 0.6
        daily_passengers: 0.4
      distance_best_m: 200
      distance_worst_m: 2000
      passengers_scale: log10
      passengers_min: 1000
      passengers_max: 500000

  # 矯正歯科寄りの仮説。競合は矯正歯科を標榜している医院だけを数えます。
  #
  # 需要側は小児寄りに振りますが 0〜14 歳一本ではありません。矯正の患者は
  # 小児と若年成人にまたがるので、生産年齢人口にも重みを残しています。
  # これも較正された係数ではなく仮説です。
  orthodontics:
    label: "矯正歯科寄り（暫定モデル）"
    description: "競合を矯正歯科の標榜医院に限定し、小児と若年層の人口を重視した仮説重み。"
    overall_weights:
      demand: 0.35
      competition: 0.30
      growth: 0.20
      accessibility: 0.15
    demand_weights:
      population: 0.22
      workers: 0.10
      age_0_14: 0.28
      age_15_64: 0.15
      age_65_plus: 0.02
      households: 0.13
      population_growth: 0.10
    competition:
      specialty: orthodontics
      population_metric: population
      metric: population_per_facility
      min_specialty_coverage: 0.8
      zero_facility_score: 95
      zero_population_score: 0
      # 矯正を標榜する医院は歯科医院全体のおよそ半分なので、1 件あたりの
      # 人口は全科目のときのおよそ 2 倍になります。
      cap: 40000
    growth:
      metric: population_growth
      low: -0.08
      high: 0.12
    accessibility:
      weights:
        station_distance: 0.6
        daily_passengers: 0.4
      distance_best_m: 200
      distance_worst_m: 2000
      passengers_scale: log10
      passengers_min: 1000
      passengers_max: 500000

  # The opposite hypothesis to `pediatric`, and the reason the worker data was
  # loaded: a practice aimed at office workers, where the catchment fills up on
  # weekday lunchtimes and empties at night. Nothing here is calibrated either
  # -- it is a second opinion, not a better one.
  office:
    label: "オフィス街型（暫定モデル）"
    description: "従業者数を重視した仮説重み。昼間人口の代理として経済センサスの従業者数を使用。"
    overall_weights:
      demand: 0.40
      competition: 0.30
      growth: 0.10
      accessibility: 0.20
    demand_weights:
      population: 0.10
      workers: 0.45
      age_0_14: 0.02
      age_65_plus: 0.03
      households: 0.05
      population_growth: 0.10
      establishments: 0.25
    competition:
      metric: population_per_facility
      zero_facility_score: 95
      zero_population_score: 0
      cap: 20000
    growth:
      metric: population_growth
      low: -0.08
      high: 0.12
    accessibility:
      weights:
        station_distance: 0.6
        daily_passengers: 0.4
      distance_best_m: 200
      distance_worst_m: 2000
      passengers_scale: log10
      passengers_min: 1000
      passengers_max: 500000

  # -------------------------------------------------------------------------
  # 地価を勘案したプロファイル。
  #
  # The other profiles answer "where is it good". This one answers "where is
  # it good for what it costs", which is a different question and gives a
  # visibly different ranking: central commercial land scores well on demand
  # and access, then gives most of it back on cost.
  #
  # `default` and the rest are deliberately unchanged. Their numbers are what
  # the reader has been looking at, and a cost axis is an opinion -- offered
  # beside the old answer, not substituted for it.
  #
  # The cost weight (0.20) is a hypothesis like every other number in this
  # file. It says roughly "cost matters about as much as growth and access
  # together", which is arguable; argue with it here rather than in code.
  cost_aware:
    label: "地価考慮（暫定モデル）"
    description: >
      標準モデルに地価公示によるコスト軸を加えた仮説重み。
      地価は賃料そのものではなく、公表されている中で唯一の座標付きの価格指標として
      代理に使っています。実績データによる較正は行っていません。
    overall_weights:
      demand: 0.30
      competition: 0.25
      growth: 0.10
      accessibility: 0.15
      cost: 0.20
    demand_weights:
      population: 0.28
      workers: 0.20
      age_0_14: 0.12
      age_65_plus: 0.12
      households: 0.16
      population_growth: 0.12
    competition:
      metric: population_per_facility
      zero_facility_score: 95
      zero_population_score: 0
      cap: 20000
    growth:
      metric: population_growth
      low: -0.08
      high: 0.12
    accessibility:
      weights:
        station_distance: 0.6
        daily_passengers: 0.4
      distance_best_m: 200
      distance_worst_m: 2000
      passengers_scale: log10
      passengers_min: 1000
      passengers_max: 500000
    # --- Cost --------------------------------------------------------------
    cost:
      # 地価公示の標準地の中央値（円/m²）。商圏内に商業地があれば商業地、
      # なければ全用途区分の中央値。どちらを使ったかは land_price_basis に入ります。
      metric: land_price_yen_per_sqm
      # 都内だけで4桁違う（林地 2,240 円/m² 〜 銀座 67,100,000 円/m²）ため、
      # 線形だと郊外がすべて同じ値に潰れます。
      scale: log10
      # これ未満の地点数しか商圏内に無いときは算出しません。標準地は都道府県で
      # 数千地点しかなく、1地点の中央値はその1地点そのものです。
      min_points: 3
    # コストを算出できない地点は、このモデルでは順位を付けません。
    # 落として残りの重みを正規化すると「コストが分からない＝コストがかからない」
    # という意味になり、いちばん情報の乏しい場所が1位に来ます（実際に来ました）。
    # 東京都で3地点以上を満たすのは約71%のメッシュです。
    required_components: [cost]


# Trade-area radii offered by the UI, metres.
trade_area_radii_m: [500, 1000, 2000]

# Radius used when scoring every mesh for the ranking / heat map.
mesh_scoring_radius_m: 1000
