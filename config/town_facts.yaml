# 「この街、どんな街？」——街の意外な事実。
#
# ---------------------------------------------------------------------------
# **数えるのは Python、驚くのは読み手。**
#
# 出すのは「値」ではなく「比べた結果」です。7,331 人と言われた読み手にできる
# のは言い換えだけですが、「県内 5,448 商圏の上位 3%」と言われた読み手は、
# その街を他の街と並べて考えられます。
#
# だからここに書くのは **どの比較を、どのくらい離れていたら出すか** です。
# 数え方（percentile も順位も比も）はコードにあります。設定ファイルに数え方
# まで書けるようにすると、設定が小さな言語になって、書き間違いが黙って
# 無視されます。
#
# **「意外」を作るために事実を曲げません。** 出典とデータ時点は必ず添え、
# 根拠が弱いものは出しません（`min_confidence`）。開業の成否・売上・患者数の
# 予測はしません——それはこの製品が最初から置いている前提です。
# ---------------------------------------------------------------------------

version: 1

# 出す件数と、出さない線引き。
count: 5
# 同じ話題で埋めない。人口の話 5 枚は「5 つの発見」ではありません。
max_per_theme: 1
# 根拠が弱いものは表示しない（0〜1）。母集団が小さい比較はここで落ちます。
min_confidence: 0.7

# 話題の重み。**対比のほうが単独の高さより面白い**ので、少し重くします。
# 「人口が多い」より「昼と夜で違う」「いまと将来で逆」のほうが、読み手の
# 知らなかったことに当たりやすい。
theme_weight:
  contrast: 1.4        # 昼夜・いまと将来・需要と供給
  peers: 1.2           # 同規模の街と比べて
  level: 1.0           # 単独の指標の高さ・低さ

# ---------------------------------------------------------------------------
# 指標ごとの見出し。**percentile がここを超えたら候補になります。**
#
#   theme      話題（同じ話題は 1 枚まで）
#   at_least   上位側の閾値（percentile）。95 なら「上位5%以内」
#   at_most    下位側の閾値。5 なら「下位5%以内」
#   high/low   その向きのときの見出し
#   why        なぜそれが面白いのか。**断定しない書き方で**
# ---------------------------------------------------------------------------
metrics:
  - key: population
    theme: population
    at_least: 92
    at_most: 8
    high: 人がぎゅっと住んでいる街
    low: 住んでいる人が少ない街
    why: 同じ半径で測った商圏どうしの比較です。街の広さではなく、密度の話です。

  - key: workers
    theme: daytime
    at_least: 92
    at_most: 8
    high: 昼になると人が集まる街
    low: 昼に人が出ていく街
    why: "従業者数は「そこで働いている人」です。**通学者は含みません**——大学の門前では、そこにいる人の多くがこの数字に現れません。"

  - key: elderly_share
    theme: age
    at_least: 90
    at_most: 10
    high: 高齢層が厚い街
    low: 高齢層が薄い街
    why: 割合の話です。人数が多いか少ないかは、商圏人口のほうを見てください。

  - key: child_share
    theme: age
    at_least: 90
    at_most: 10
    high: 子どもの割合が高い街
    low: 子どもの割合が低い街
    why: "子育て世代が住んでいる街かどうかの目安になります。就学先や通学動線までは、この数字からは分かりません。"

  - key: population_growth
    theme: change
    at_least: 90
    at_most: 10
    high: 直近5年で人が増えた街
    low: 直近5年で人が減った街
    why: 2015年と2020年の国勢調査の差です。**将来の話ではありません。**

  - key: daily_passengers
    theme: station
    at_least: 90
    high: 駅の利用者が多い街
    why: "乗降客数は駅を使う人の数で、街の人口とは別の数字です。周辺人口だけでは説明できない出入りがあるかどうかの手がかりになります。"

  - key: clinics_per_10k
    theme: supply
    at_least: 90
    at_most: 10
    high: 歯科医院が集まっている街
    low: 歯科医院が少ない街
    why: "医院数は施設の数で、ユニット数でも診療実績でもありません。入口の指標です。少ないことが機会とは限りません（成り立たなかった可能性も同じだけあります）。住んでいる人が少ない街では、この比率は大きく出ます。"

  - key: land_price_yen_per_sqm
    theme: cost
    at_least: 92
    at_most: 8
    high: 地価が高い街
    low: 地価が安い街
    why: 地価公示の標準地の中央値です。**賃料ではありません。**

# ---------------------------------------------------------------------------
# 対比の見出し（positioning の gaps から。**2 つの軸のズレ**が元になります）。
# ズレの大きさはコードが計算し、出すかどうかの閾値は positioning.yaml 側です。
# ---------------------------------------------------------------------------
gaps:
  - key: residents_vs_workers
    theme: daytime
    title: 昼と夜で、人の数が入れ替わる街
    why: 住んでいる人の規模と、働きに来る人の規模がそろっていません。
  - key: now_vs_future
    theme: change
    title: いまの規模と、人口の増減がかみ合わない街
    why: いまの人口規模に対して、増減率が同じ方向を向いていません。
  - key: demand_vs_supply
    theme: supply
    title: 人の数と、歯科医院の数がかみ合わない街
    why: 需要側の規模と供給側の多さがそろっていません。医院数は入口の指標です。
  - key: demand_vs_cost
    theme: cost
    title: 人の数のわりに、地価が振れている街
    why: 需要側の規模と地価の水準がそろっていません。地価は賃料ではありません。

# ---------------------------------------------------------------------------
# 同規模の街との比較（peers の standouts から）。**相手は名前で出します。**
# 「県内で上位3%」より「三島・掛川と比べて」のほうが、読み手には近い話です。
# ---------------------------------------------------------------------------
peers:
  theme: peers
  title: 同規模の街と比べると、{label}が{direction}街
  direction_high: 際立って多い
  direction_low: 際立って少ない
  why: "規模の近い街どうしの比較です。県全体の分布ではなく、**名前のある相手**と並べています。"

# ---------------------------------------------------------------------------
# 出せない比較。**黙って埋めないために、ここに理由を書きます。**
#
# 全国比較は「まだ取り込んでいないから出せない」のであって、「意味がないから
# 出さない」のではありません。読み手にはその区別がつきません。
# ---------------------------------------------------------------------------
unavailable:
  - what: 全国平均・全国順位との比較
    why: "全国のメッシュ統計を取り込んでいないためです。取り込んである都道府県の中でだけ比較しています。"
