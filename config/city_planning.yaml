# 都市計画の区域の「一言でいうと何か」。
#
# **業態に依らない説明です。** 用途地域の意味は診療所でも病院でも同じなので、
# ここは業態フォルダの外に置きます。そこに施設を建てられるかどうか
# （業態で変わる）は config/<業態>/city_planning.yaml のほうです。
#
# 地図の吹き出しとデータセットが同じ文を使います。片方だけ直すと、画面と
# レポートで別のことを言い出します。
#
# ここに無い区分は説明なしで名前だけが出ます。**知らない区分に説明を
# でっち上げないため**です。

descriptions:
  # ------------------------------------------------------------- 区域区分
  市街化区域: >-
    すでに市街地になっている区域と、おおむね10年以内に優先的に市街化する区域。
    用途地域が定められます。
  市街化調整区域: >-
    市街化を抑制する区域。原則として建築できず、開発許可に該当する場合の
    例外的な扱いになります。

  # ------------------------------------------------------------- 用途地域
  第一種低層住居専用地域: >-
    低層住宅のための区域。建てられる建物の種類と規模の制限が最も厳しく、
    高い建物はありません。
  第二種低層住居専用地域: >-
    低層住宅のための区域。小規模な店舗（150m²まで）が認められます。
  第一種中高層住居専用地域: >-
    中高層住宅のための区域。中規模の店舗・事務所（500m²まで）が認められます。
  第二種中高層住居専用地域: >-
    中高層住宅のための区域。1,500m²までの店舗・事務所が認められます。
  第一種住居地域: >-
    住居の環境を守る区域。3,000m²までの店舗・事務所・ホテルが認められます。
  第二種住居地域: >-
    住居の環境を守る区域。10,000m²までの店舗・事務所のほか、カラオケ店なども
    認められます。
  準住居地域: >-
    道路の沿道で、自動車関連施設と住居が調和する区域。
  近隣商業地域: >-
    近隣の住民が日用品を買う店舗のための区域。住宅・店舗が混在します。
  商業地域: >-
    銀行・映画館・飲食店・百貨店などが集まる区域。容積率が高く、
    テナントの入るビルが建ちます。
  準工業地域: >-
    環境悪化のおそれのない工場のための区域。住宅・店舗も建てられます。
  工業地域: >-
    どんな工場でも建てられる区域。住宅・店舗は建てられますが、
    学校・病院・ホテルは建てられません。
  工業専用地域: >-
    工場のための区域。住宅・店舗・学校・病院・診療所は建てられません。

  # ------------------------------------------------------- 立地適正化計画
  立地適正化計画区域: >-
    立地適正化計画の対象となる区域。誘導区域そのものではありません。
  居住誘導区域: >-
    人口減少のなかでも一定の人口密度を維持し、生活サービスを保つために、
    市町が居住を誘導する区域。
  都市機能誘導区域: >-
    医療・福祉・商業などの都市機能を集約するために市町が定めた区域。
    医療施設は誘導施設の代表例です。

  # ----------------------------------------------------------- そのほかの地域地区
  防火地域: >-
    建物を耐火・準耐火構造にすることが求められる区域。建築コストに影響します。
  準防火地域: >-
    防火地域に準じた構造の制限がある区域。
  高度地区: 建物の高さの最高限度または最低限度が定められた地区。
  高度利用地区: >-
    土地の高度利用を図るため、容積率の最低限度や建築面積の最低限度などが
    定められた地区。
  特別用途地区: 用途地域に上乗せして、特定の用途を制限または誘導する地区。
  特定用途制限地域: >-
    用途地域が定められていない区域で、特定の用途の建築物を制限する地域。
  風致地区: >-
    都市の風致を維持するための地区。建物の高さ・建蔽率・意匠などに制限が
    かかります。
  地区計画: >-
    地区の特性に応じて、建物の用途・形態・道路や公園の配置を細かく定めた計画。
    用途地域では建てられるものが、地区計画で制限されることがあります。
  土地区画整理事業: >-
    道路・公園などを整えながら宅地の区画を整理する事業。施行中の区域では、
    数年のうちに街区と居住者が変わります。
  都市計画区域: 都市計画を定める対象となる区域。
  準都市計画区域: >-
    都市計画区域外で、放置すると将来の都市整備に支障が出る区域。
  公園: 都市計画で定められた公園。
  緑地: 都市計画で定められた緑地。
