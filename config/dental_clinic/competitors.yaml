# 競合分析（3C の Competitor）。
#
# ---------------------------------------------------------------------------
# **業態ごとに語彙が違います。コードに埋めません。**
#
# 歯科なら「インプラント」「小児歯科」、飲食なら「客単価」「業態」、学習塾なら
# 「集団／個別」「受験対応」。**枠（STP と 4P）は業態を問わず同じ**で、
# 中に入る語だけが違います。だから枠はスキーマに、語はここに置きます。
#
# 新しい業態を足すときは config/<業態>/competitors.yaml を作るだけです。
# ---------------------------------------------------------------------------

version: 1

# 何を競合と呼ぶか。画面とプロンプトに出ます。
label: 歯科医院

# ---------------------------------------------------------------------------
# 調べる範囲と、使ってよい検索回数。
#
# **ここが「地域一般の調査」から振り替えたリソースです。** 周辺一般の分析は
# PATTERN ごとに 2 回、合計 8 回でした。競合分析はそれを 1 医院ずつに配ります。
# ---------------------------------------------------------------------------
survey:
  # 対象にする半径（指示書 §1：基本は 1km 圏）。
  radius_m: 1000

  # 「近い」の線引き（指示書 §4：500m 圏・1km 圏の competitors 数）。
  # 徒歩 80m/分で 6 分強。ここより近い医院は、同じ通行者を取り合います。
  near_radius_m: 500

  # 調べる上限。**近い順**です。
  #
  # 全部調べません。1km 圏に 30 院ある商圏では、30 院ぶんの検索は費用も時間も
  # 見合いません。**近い医院ほど競合として効く**ので、近い順に切ります。
  # 切った件数はレポートに出ます（黙って落としません）。
  #
  # 節約中はこの値ではなく config/analysis.yaml の budget が勝ちます
  # （`analyze --budget` に実際に効いている値が出ます）。
  max_competitors: 12

  # 1 医院あたりの検索回数。医院名＋地名で 1 回、公式サイトの中身で 1 回。
  searches_per_competitor: 2

  # ---------------------------------------------------------------------
  # 1 医院あたり、**ページを開いて読む**回数。
  #
  # 検索だけでは、返ってくるのは結果ページの抜粋です。「インプラント専門」も
  # 自費の価格表も診療時間も、**医院のサイトの中にあって抜粋には出ません。**
  #
  # 実測：中野歯科医院の公式サイト（super-c.co.jp/nakano/）は検索結果に出て
  # いたのに、レポートには「検索ツールの利用制限によりアクセスできず」と
  # 書かれました。開く手段を渡していなかったからです。同じ回に山本矯正歯科は
  # **医院名だけを根拠に**「矯正専門・自費寄り」と判定されていました。
  #
  # 3 回は「トップ + 診療内容 + 料金/アクセス」の見当です。
  fetches_per_competitor: 3

  # 同時に走らせる本数。1 で直列（レート制限に当たったときの逃げ道）。
  #
  # **波の数が待ち時間を決めます。** 12 院を 4 本ずつだと 3 波で、1 波の長さは
  # その波のいちばん遅い医院で決まります。実測：3 波が関数の上限（800秒）を
  # 越えて殺され、6 院ぶん調べ終えていたものも一緒に消えました。6 本なら
  # 2 波です。
  #
  # 上げすぎるとレート制限に当たり、当たると待たされるので、結局遅くなります。
  parallel: 6

# ---------------------------------------------------------------------------
# 4P の Product。**この地域に何が多くて何が少ないか**を数えるための語彙です。
#
# 届出の標榜科目とは別物です。標榜科目にインプラントはありません（自由記載欄
# にしかなく、記載率は東京都で 1% 台）。**だから Web を見に行きます。**
# ---------------------------------------------------------------------------
products:
  - 一般歯科
  - 小児歯科
  - 矯正歯科
  - インプラント
  - 審美歯科
  - ホワイトニング
  - 予防歯科
  - 訪問歯科
  - 口腔外科
  - 歯周病治療

# STP の Segmentation / Targeting に使う語彙。
segments:
  - 小児
  - 学生
  - 成人
  - 高齢者
  - 女性
  - ファミリー
  - 勤務者

# 4P の Place。**確認できたかどうか**を数えるので、真偽ではなく3値です。
place_attributes:
  - key: parking
    label: 駐車場
  - key: weekend
    label: 土日診療
  - key: evening
    label: 夜間診療（18時以降）
  - key: barrier_free
    label: バリアフリー

# ---------------------------------------------------------------------------
# ポジショニングマップ（指示書 §5）。
#
# **判定根拠が弱ければ配置しません。** 「判定困難」は失敗ではなく、
# 公開情報から読めなかったという事実です。無理に置くと、地図の上では
# 同じ確かさの点に見えます。
# ---------------------------------------------------------------------------
positioning_map:
  x:
    key: payment
    label: 診療の支払い
    low: 保険診療中心
    high: 自費診療中心
  y:
    key: scope
    label: 診療の幅
    low: 一般診療中心
    high: 専門診療中心
  scale: [-2, -1, 0, 1, 2]

  # -------------------------------------------------------------------------
  # **位置は LLM に判定させません。観測できた事実から計算します。**
  #
  # 「保険診療中心か自費診療中心か」は売上の構成比であって、Web サイトからは
  # 見えません。見えないものを判定しろと言われた LLM は、
  #
  #   前回 … 医院名から推測した（「山本矯正歯科だから自費・専門」）
  #   今回 … 全件「判定不能」を返した（価格表が無いから決められない、と）
  #
  # のどちらかになります。**どちらもプロンプトの書き方の問題ではありません。**
  # 観測できない量を 1 回の判断で当てさせているのが問題です。
  #
  # だから LLM には**見えるものだけ**を挙げさせ（signals）、位置はここの
  # 重みで足し算します。同じ観測なら誰が計算しても同じ位置になり、なぜその
  # 位置なのかを 1 行ずつ遡れます。**これが「GIS が Fact を確定し、LLM は
  # それを解釈する」の、この画面での形です。**
  #
  # min_signals … その軸で最低これだけ観測できなければ、その軸は判定しない。
  #               0 件を「どちらとも言えない（0）」と書くと、**調べなかった
  #               のと真ん中だったのが混ざります。**
  # -------------------------------------------------------------------------
  min_signals: 1

  signals:
    # --- 支払い（保険 ←→ 自費）---
    - key: jihi_page
      label: 自費診療（インプラント・矯正・審美等）の専用ページがある
      axis: payment
      weight: 1
    - key: price_list
      label: 自費の価格を金額で掲載している
      axis: payment
      weight: 1
    - key: case_record
      label: 症例数・実績を数字で掲げている
      axis: payment
      weight: 1
    - key: advanced_equipment
      label: CT・マイクロスコープ等、自費治療に使う設備を掲げている
      axis: payment
      weight: 1
    - key: free_access
      label: 予約不要・フリーアクセスを掲げている
      axis: payment
      weight: -1
    - key: insurance_first
      label: 保険診療・かかりつけであることを前面に出している
      axis: payment
      weight: -1

    # --- 幅（一般 ←→ 専門）---
    - key: specialist_cert
      label: 学会の専門医・認定医であることを掲げている
      axis: scope
      weight: 1
    - key: training_facility
      label: 研修施設・臨床研修施設の指定を掲げている
      axis: scope
      weight: 1
    - key: dedicated_site
      label: 特定領域の専用サイト、または専用ページ群がある
      axis: scope
      weight: 1
    # 「診療科目を網羅的に並べている」は入れていません。**歯科ではほぼ全院に
    # 立つので、軸を動かしません。** 実測：裾野の 2 院はどちらも一般・小児・
    # 矯正・インプラント・口腔外科を並べていて、この観測を -1 で入れたところ
    # 専門側の観測と打ち消し合い、対照的な 2 院がどちらも 0 になりました。
    # **全件に立つ観測は、区別の役に立ちません。**
    - key: family_clinic
      label: 家族全員・かかりつけ・地域密着を訴求している
      axis: scope
      weight: -1
