# 競合分析（3C の Competitor）。
#
# ---------------------------------------------------------------------------
# **業態ごとに語彙が違います。コードに埋めません。**
#
# 歯科なら「インプラント」「小児歯科」、飲食なら「客単価」「業態」、学習塾なら
# 「集団／個別」「受験対応」。**枠（STP と 4P）は業態を問わず同じ**で、
# 中に入る語だけが違います。だから枠はスキーマに、語はここに置きます。
#
# 新しい業態を足すときは config/<業態>/competitors.yaml を作るだけです。
# ---------------------------------------------------------------------------

version: 1

# 何を競合と呼ぶか。画面とプロンプトに出ます。
label: 歯科医院

# ---------------------------------------------------------------------------
# 調べる範囲と、使ってよい検索回数。
#
# **ここが「地域一般の調査」から振り替えたリソースです。** 周辺一般の分析は
# PATTERN ごとに 2 回、合計 8 回でした。競合分析はそれを 1 医院ずつに配ります。
# ---------------------------------------------------------------------------
survey:
  # 対象にする半径（指示書 §1：基本は 1km 圏）。
  radius_m: 1000

  # 「近い」の線引き（指示書 §4：500m 圏・1km 圏の competitors 数）。
  # 徒歩 80m/分で 6 分強。ここより近い医院は、同じ通行者を取り合います。
  near_radius_m: 500

  # 調べる上限。**近い順**です。
  #
  # 全部調べません。1km 圏に 30 院ある商圏では、30 院ぶんの検索は費用も時間も
  # 見合いません。**近い医院ほど競合として効く**ので、近い順に切ります。
  # 切った件数はレポートに出ます（黙って落としません）。
  max_competitors: 12

  # 1 医院あたりの検索回数。医院名＋地名で 1 回、公式サイトの中身で 1 回。
  searches_per_competitor: 2

  # 同時に走らせる本数。1 で直列（レート制限に当たったときの逃げ道）。
  parallel: 4

# ---------------------------------------------------------------------------
# 4P の Product。**この地域に何が多くて何が少ないか**を数えるための語彙です。
#
# 届出の標榜科目とは別物です。標榜科目にインプラントはありません（自由記載欄
# にしかなく、記載率は東京都で 1% 台）。**だから Web を見に行きます。**
# ---------------------------------------------------------------------------
products:
  - 一般歯科
  - 小児歯科
  - 矯正歯科
  - インプラント
  - 審美歯科
  - ホワイトニング
  - 予防歯科
  - 訪問歯科
  - 口腔外科
  - 歯周病治療

# STP の Segmentation / Targeting に使う語彙。
segments:
  - 小児
  - 学生
  - 成人
  - 高齢者
  - 女性
  - ファミリー
  - 勤務者

# 4P の Place。**確認できたかどうか**を数えるので、真偽ではなく3値です。
place_attributes:
  - key: parking
    label: 駐車場
  - key: weekend
    label: 土日診療
  - key: evening
    label: 夜間診療（18時以降）
  - key: barrier_free
    label: バリアフリー

# ---------------------------------------------------------------------------
# ポジショニングマップ（指示書 §5）。
#
# **判定根拠が弱ければ配置しません。** 「判定困難」は失敗ではなく、
# 公開情報から読めなかったという事実です。無理に置くと、地図の上では
# 同じ確かさの点に見えます。
# ---------------------------------------------------------------------------
positioning_map:
  x:
    key: payment
    label: 診療の支払い
    low: 保険診療中心
    high: 自費診療中心
  y:
    key: scope
    label: 診療の幅
    low: 一般診療中心
    high: 専門診療中心
  # -2 〜 +2 の 5 段階。0 は「どちらとも言えない」で、判定できなかったのとは
  # 違います（そちらは null）。
  scale: [-2, -1, 0, 1, 2]
