# プレDD レポートの判定基準。
#
# ---------------------------------------------------------------------------
# **しきい値と文言はここに。判定そのものはコードに。**
#
# 「人口が何％減ったらリスクか」は事業の判断で、業態と時期で変わります。
# コードに埋めると、変えるのにデプロイが要る。逆に「何をどう数えるか」を
# 設定に書けるようにすると、設定ファイルが小さな言語になって、書き間違いが
# 黙って無視されます。だから **数え方はコード、線引きはここ** に分けます。
#
# 各リスクの `check` は dd.py の関数名です。ここに無い check を書くと
# 起動時に落ちます（黙って無視されません）。
# ---------------------------------------------------------------------------

version: 1

# 章立て。レポートの見出しはここが決めます。
chapters:
  - {key: summary,      title: Executive Summary}
  - {key: trade_area,   title: 商圏分析}
  - {key: competition,  title: 競合分析}
  - {key: location,     title: 立地分析}
  - {key: demand,       title: 人口・需要分析}
  - {key: outlook,      title: 将来性}
  - {key: risks,        title: リスク}
  - {key: growth,       title: 成長余地・KSF}
  - {key: further_dd,   title: 追加DDで確認すべき事項}
  - {key: verdict,      title: 総合評価}

# ---------------------------------------------------------------------------
# リスク（第7章）。**該当したものだけを出します。**
#
# 「該当しなかった」を並べると、調べた量が多く見えます。読む人が知りたいのは
# 引っかかった項目だけです。
#
# severity は high / medium / low。並び順にも使います。
# ---------------------------------------------------------------------------
risks:
  - key: population_shrinking
    label: 商圏人口が減っている
    check: population_growth_below
    threshold: -3.0            # 2015→2020 の増減率（％）
    severity: high
    why: 開業なら患者数の前提が、承継ならのれん代の前提が崩れます。
    verify: 直近の住民基本台帳、開発計画の有無、転入超過の年次推移

  - key: supply_dense
    label: 人口あたりの歯科医院数が多い
    check: axis_percentile_above
    axis: supply
    threshold: 75
    severity: medium
    why: 新患の取り合いになります。既存医院の買収でも、患者数の維持に費用がかかります。
    verify: 各院のユニット数と診療実績（医院数は入口の指標にすぎません）

  - key: new_entrants
    label: 直近に新規開設があった
    check: opened_recently_at_least
    threshold: 2
    severity: medium
    why: 今の競合数ではなく、これから増えるかどうかが効きます。
    verify: 開設予定の届出、テナント募集、建築確認

  - key: single_mesh_dependency
    label: 商圏人口が一つのメッシュに偏っている
    check: largest_mesh_share_above
    threshold: 0.45
    severity: medium
    why: 集合住宅1棟に依存している商圏は、建て替えや世帯構成の変化で一気に動きます。
    verify: そのメッシュの建物用途、築年、大規模団地かどうか

  - key: station_detached
    label: 駅からの動線が期待できない
    check: station_band_is
    value: 駅との関係弱
    severity: low
    why: 駅の乗降客数を来院動線として読むことができません。車と徒歩圏の商圏です。
    verify: 駐車場の台数、前面道路の交通量、周辺の生活動線

  - key: aging_supply
    label: 周辺医院の開設が古い
    check: median_opening_year_before
    threshold: 2000
    severity: low
    why: 今後10年で世代交代が起きる可能性があります。**承継なら競合の減少、開業なら
      承継案件との競合**という、向きの違う意味を持ちます。
    verify: 各院の院長年齢（開設年は院長の年齢ではありません）

  - key: outlook_missing
    label: 将来推計人口が取り込まれていない
    check: outlook_unavailable
    severity: high
    why: 将来性の章が実績のみになります。**10年先を見ずに判断することになります。**
    verify: 社人研の地域別将来推計人口（この地域ぶんの取り込み）

# ---------------------------------------------------------------------------
# 成長余地・KSF（第8章）。
#
# **「競合が少ない＝機会」と書かせないための枠**です。空いている領域は
# 「まだ誰もやっていない」のか「やってみて成立しなかった」のか区別できません。
# だから機会ではなく **確かめるべき仮説** として出します。
# ---------------------------------------------------------------------------
ksf:
  frame:
    - key: catchment
      label: 商圏をどう取るか
      question: 誰が、どの動線で来るのか。徒歩か、車か、通勤の途中か。
    - key: offer
      label: 何を提供するか
      question: 保険中心か自費の柱を作るか。周辺が薄い領域はどこか。
    - key: capacity
      label: どれだけ捌けるか
      question: ユニット数と人員。商圏人口に対して回るのか。
    - key: acquisition
      label: どう知ってもらうか
      question: 周辺医院のWeb訴求と比べて、何で見つけてもらうのか。
    - key: retention
      label: どう続けてもらうか
      question: リコール、予防、かかりつけ。一度きりで終わらせない仕組み。

# ---------------------------------------------------------------------------
# 追加DD（第9章）。**取れなかったものは、取れなかったと書く。**
#
# ここに固定で並べるのは「公開情報では原理的に取れないもの」です。
# 取得に失敗しただけのものは、データ層が自動で足します。
# ---------------------------------------------------------------------------
further_dd:
  - key: revenue
    label: 売上・利益・患者数
    why: 公開情報に存在しません。**この分析では推定もしません。**
    how: 承継なら決算書・レセプト、開業なら事業計画の前提として置く
  - key: unit_count
    label: 各院のユニット数と稼働
    why: 医院数は施設の数であって、診療能力ではありません。
    how: 現地確認、または各院サイトの院内写真
  - key: staffing
    label: 歯科衛生士の確保見込み
    why: 求人倍率は地域差が大きく、公開の地域別統計がありません。
    how: 求人媒体の掲載件数と掲載期間、近隣の養成校の所在
  - key: succession_terms
    label: 承継の条件と売り手の事情
    why: 非公開です。売り時の推定はできても、事情は分かりません。
    how: 仲介経由のヒアリング

# ---------------------------------------------------------------------------
# 提言レポート（第II部）。
#
# **プレDD（第I部）とは目的が違います。**
#
#   第I部  この商圏は「どうなっているか」   …… 事実。推論しない
#   第II部 ここで開業するなら「どうするか」 …… 推論する。仮説と明示する
#
# 分けているのは、混ぜると第I部が信用を失うからです。事実の文書に戦略提言が
# 混ざると、読み手はどこまでが確定でどこからが提案なのか分からなくなります。
# ---------------------------------------------------------------------------
advice_chapters:
  - {key: primary_patients,     title: 主要患者}
  - {key: secondary_patients,   title: 準主要患者}
  - {key: avoid_competing,      title: 積極的に競争すべきではない患者層}
  - {key: primary_catchment,    title: 第1商圏}
  - {key: secondary_catchment,  title: 第2商圏}
  - {key: reason_to_visit,      title: 患者を引き込む理由}
  - {key: clinic_model,         title: 推奨する医院モデル}
  - {key: differentiation,      title: 差別化の方向性}
  - {key: opening_risks,        title: 開業上の主要リスク}
  - {key: before_opening,       title: 開業前に追加取得すべき情報}

# 提言の根拠に付ける印。**どこまでが確定で、どこからが推測かを字面で分ける。**
evidence_tags:
  - {key: FACT,        label: 事実,       note: JSON または信頼できる外部資料に明記}
  - {key: BENCHMARK,   label: 比較,       note: 平均・周辺地域との比較で意味づけした事実}
  - {key: PATTERN,     label: パターン,   note: 複数の事実を組み合わせて見えた特徴}
  - {key: WHY,         label: 背景,       note: 外部資料で裏づけた、または合理的に推測できる要因}
  - {key: HYPOTHESIS,  label: 仮説,       note: 証拠が足りず、検証が必要}
  - {key: INSIGHT,     label: 解釈,       note: 複数のデータから導かれる経営上の意味}
  - {key: IMPLICATION, label: 示唆,       note: それが歯科医院経営に意味すること}
  - {key: ACTION,      label: 行動,       note: 開業者が取るべき具体的な行動}
