# ---------------------------------------------------------------------------
# 複合指標（insight metrics）。
#
# 単独の統計は、それ単独で読める以上のことを言いません。「0〜14歳が7,331人」は
# 7,331 という数の言い換えにしかならず、「上位6%」を足しても「子どもが多い場所」
# 止まりです。判断に使えるようになるのは、需要側と供給側と時間変化を同時に
# 見たときで、そのときに初めて「小児人口は厚いが、小児歯科の供給状況は未確認。
# だから需給ギャップを調べる価値がある」という文になります。
#
# ここでやっているのは、その「同時に見るべき組み合わせ」を宣言することだけです。
# 結論は書きません。書けるだけの根拠がここに揃っているかどうかは商圏ごとに
# 違い、揃っていないときに「揃っている風の結論」を出すのがいちばん有害だからです。
# 代わりに、components のうち何が取れて何が取れなかったか（gaps）を返します。
# 「未確認」と書けることが、この構造のいちばんの働きです。
#
# 要件で禁じている 開業成功確率・売上・患者数 の予測は、ここにも入れません。
# 出るのは「どの数字が揃っていて、どこを追加調査すべきか」までです。
#
# 指標キーは server/kaigyou_core/measures.py の MEASURE_SPECS のもの。
# ---------------------------------------------------------------------------

version: 1

insights:

  child_population_strength:
    label: 小児人口の厚み
    question: 小児歯科の需要側が、周辺と比べてどれだけ厚いか
    components:
      - child_population
      - child_share
      - households
      - population_growth
      - specialty_clinics          # 標榜科目を絞ったプロファイルでのみ取得可
    note: >
      需要側（子どもの数と構成比）と供給側（小児歯科の標榜医院数）を並べたもの。
      供給側は診療科目データが読み込まれていて、かつ標榜科目を絞ったプロファイル
      （profile=pediatric）で呼んだときにだけ入ります。片側しか無いときは、
      需給ギャップではなく需要側だけが分かっている状態です。

  elderly_demand:
    label: 高齢者の需要
    question: 高齢者向けの診療（義歯・訪問）の需要側が厚いか
    components:
      - elderly_population
      - elderly_share
      - population
      - population_growth
    note: >
      訪問歯科診療の実施医院数は自由記載欄にしかなく、記載率が数%のため
      供給側の指標には入れていません。需要側のみです。

  daytime_demand:
    label: 昼間需要
    question: 通勤・通学で昼間に増える需要がどれだけあるか
    components:
      - workers
      - establishments
      - population
      - dental_clinics
    note: >
      従業者数は昼間人口ではありません（通学者・来街者を含まない）。
      常住人口と足すと通勤者を二重に数えます。両方を並べているのは、
      その差が大きい場所ほど常住人口ベースの需給指標が実態から外れるためです。

  supply_pressure:
    label: 供給の混み具合
    question: 歯科医院の供給が、人口に対して周辺と比べて多いか少ないか
    components:
      - dental_clinics
      - population_per_clinic
      - clinics_per_10k
      - population
    note: >
      同じ「歯科医院20院」でも、人口8千人の商圏と4万人の商圏では意味が違います。
      実数・1院あたり人口・人口1万人あたり院数の3つを並べているのは、
      どれか1つでは商圏の規模と混み具合が分離できないためです。

  accessibility:
    label: 立地の到達性
    question: 人が集まる導線の上にあるか
    components:
      - station_distance_m
      - daily_passengers
      - workers
    note: >
      駅距離は直線距離です。街路・踏切・河川を考慮した徒歩距離ではありません
      （商圏の形に「徒歩圏」を選ぶと商圏側は街路網に沿いますが、この距離は別）。

  cost_position:
    label: コストの位置
    question: 立地の良さに対して、土地の値段が周辺と比べてどうか
    components:
      - land_price_yen_per_sqm
      - population
      - workers
      - daily_passengers
    note: >
      地価は土地1m²の価格であり、賃料でも初期投資額でもありません。
      テナント賃料の代わりには使えません。座標付きで公表されている唯一の
      価格指標として、コストの相対的な位置づけにのみ使っています。

# ---------------------------------------------------------------------------
# 比較する母集団（ベンチマーク）。
#
# パーセンタイルの本当の危険は計算違いではありません。**母集団が的外れでも、
# 数字はもっともらしく出続ける**ことです。
#
# 静岡県のメッシュの大半は山林と農地です。そこを母集団にすると、町の中心なら
# どこでも自動的に上位数%に入ります。裾野市（人口約4.8万人、子どもの割合は
# 県平均並みかやや低め）の駅前が「子どもの絶対数が県内上位4.5%」と出たのが
# それで、この数字が言っているのは「そこが市街地である」ということだけです。
#
# 東京の山間部で同じことを測ると、5市町村の集合では83%が生活圏の下限を下回り、
# 17,231人という平凡な郊外の商圏が「上位4.5%」に入りました。県全域比較は、
# 人口が少ない県ほど「市街地かどうか」しか測らなくなります。
#
# 対処は2つです。母集団を選び直すことと、選び直せないときに黙らないことです。
# ---------------------------------------------------------------------------
benchmarks:

  # 母集団の候補。上から順に見て、最初に「弁別力がある」ものを代表値に使います。
  # 代表に選んだ理由は primary_benchmark_reason に出るので、東京と静岡で
  # 違う母集団が使われていても読み手には分かります。
  preference:
    - prefecture         # 県内すべて。人口が多い県ではこれで十分弁別できる
    # 市街地どうし。閾値は決め打ちではなく、その県で歯科医院が成立している
    # 商圏人口の実測下限（viable_floor）です。
    #
    # with_clinics より前に置いています。「歯科医院が実在する商圏」には、
    # 山あいの集落に1院あるだけの商圏も入ります。静岡ではその母集団の53%が
    # 生活圏の下限を下回り、医院数の中央値は2院でした。「9院は中央値の4.5倍」
    # という文は、市街地を農村と比べた結果です。
    - urban
    - with_clinics       # 県内で歯科医院が実在する商圏（＝開業が成立した実績のある場所）
    - nearby             # この地点の周辺。実際に選びうる代替地
    - station_front      # 県内の駅前どうし
    # 同一市区町村＋隣接市町。市の内側だけの順位は、市の大きさで意味が変わり
    # ます（小さい市なら市街地はどこでも上位に入る）。隣を足すと、開業地を
    # 探している人が実際に並べている範囲での順位になります。
    - neighbourhood
    - municipality       # 同一市区町村内

  # 「弁別力がある」の判定。母集団のうち、生活圏の下限を下回るものの割合が
  # これを超えたら、その母集団では上位・下位を語れないものとして扱います。
  # そのとき significance（極めて高い等）は算出しません。percentile と順位は
  # 事実なので出しますが、「極めて高い」という評価だけは付けません。
  # 評価が付かなければ、「本商圏の最大のエンジン」という文は書けません。
  max_share_below_viable_floor: 0.5

  # 生活圏の下限は決め打ちしません。**県内で実際に歯科医院がある商圏の人口の
  # 下位10%点**を使います。誰も山の中では開業していないので、この値は
  # 「その県で開業が成立している人口規模の下限」の実測値になります。
  # （東京では9,636人。恣意的な閾値を1つも置かずに済みます）
  viable_floor_percentile: 0.10

  # 「この地点の周辺」の広さ。実際に選びうる代替地の範囲。
  # 3kmだと農村部では「駅前 vs 隣の田んぼ」になり、駅前がまた特別に見えます。
  # 10kmなら隣町・隣の駅が入るので、比較として成立します。
  nearby_radius_m: 10000

  # 「駅前どうし」と見なす、駅からの距離。
  station_front_m: 800

  # これを下回る母集団は使いません。10件の中の「上位10%」は1位というだけで、
  # 分布ではありません。
  min_sample: 30


# ---------------------------------------------------------------------------
# 地価からテナント賃料の目安への換算。
#
# 賃料の「予測」はしません。ここでやるのは、土地の価格を想定利回りという
# 1つの仮定で賃料の次元に置き換えることだけです。式も仮定もレポートに載せるので、
# 読み手は自分の利回り観で引き直せます。
#
#   月額賃料（円/坪） = 地価（円/m²） × 3.305785 × 想定利回り ÷ 12
#
# 幅で出すのは、幅があることがこの換算の実態だからです。1つの数字に決め打ちすると、
# 出てきた数字が一人歩きします。募集賃料のデータは取り込んでいないので、
# 実勢との差は検証できていません。
# ---------------------------------------------------------------------------
rent_estimate:
  # 想定利回り（年）の下限と上限。地域や物件種別で変わります。
  yield_range: [0.06, 0.10]
