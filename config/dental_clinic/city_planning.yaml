# 用途地域・区域区分と、そこにこの業態の施設を建てられるか。
#
# **この判断は業態で変わります。** 建築基準法 別表第2 では、診療所（患者の
# 収容施設が無いもの）は工業専用地域を除くすべての用途地域で建てられますが、
# 病院は第一種・第二種低層住居専用地域、第一種中高層住居専用地域、工業地域、
# 工業専用地域で建てられません。だからこのファイルは業態フォルダにあります。
# 病院版を作るときは config/hospital/city_planning.yaml を置きます。
#
# **これは一次情報であって建築確認ではありません。** 実際の可否は規模・接道・
# 用途地域の細目・自治体の条例で変わり、決めるのは特定行政庁です。
# disclaimer は API とレポートにそのまま出ます。

#: レポートに書くときの施設の呼び方。
facility_label: 診療所

#: 用途地域ごとの扱い。ここに無い用途地域は default に落ちます。
#: buildable が false のものだけが「建てられない」で、それ以外は
#: 「建てられるが条件がある」か「制限なし」です。
zone_rules:
  工業専用地域:
    buildable: false
    note: >-
      建築基準法 別表第2 により、工業専用地域に診療所は建てられません。
      工業地域（「専用」が付かないほう）とは別の区分です。
  第一種低層住居専用地域:
    buildable: true
    caution: >-
      診療所は建てられますが、用途に供する部分の床面積と階数に制限があります。
      戸建て併用の小規模開業を想定する区域で、テナントビルはありません。
  第二種低層住居専用地域:
    buildable: true
    caution: >-
      診療所は建てられますが、規模の制限があります。低層住宅地です。
  第一種中高層住居専用地域:
    buildable: true
    caution: 中高層の住宅地。店舗・事務所の規模に制限があります。
  工業地域:
    buildable: true
    caution: >-
      診療所は建てられますが、住宅・商業が混在しない区域なので、
      昼間人口と常住人口が大きくずれることがあります。

#: 上に無い用途地域の扱い（商業地域・近隣商業地域・住居地域など）。
default:
  buildable: true

#: 区域区分。用途地域とは別の軸で、こちらのほうが強い制約です。
area_division_rules:
  市街化調整区域:
    buildable: false
    note: >-
      市街化を抑制する区域で、原則として建築できません。開発許可（都市計画法
      第34条）に該当する場合に限り可能性がありますが、例外の扱いです。
      **ここが候補地なら、他の数字を読む前にここを確かめてください。**
  市街化区域:
    buildable: true

#: 立地適正化計画の誘導区域。規制ではなく、市町の意思表示です。
#: 将来推計人口が「このままいくとこうなる」を示すのに対して、
#: こちらは「行政がこうしようとしている」を示します。
guidance_notes:
  都市機能誘導区域: >-
    市町が医療・福祉・商業などの都市機能をここに集めると決めた区域です。
    医療施設は誘導施設の代表例で、市町によっては支援措置の対象になります。
    区域外への立地は届出の対象になることがあります。
  居住誘導区域: >-
    市町が住民の居住を誘導する区域です。区域内は、人口が減る局面でも
    行政が生活サービスを維持しようとする範囲にあたります。
  立地適正化計画区域: >-
    立地適正化計画の対象となる区域です。誘導区域そのものではありません。

#: 免責。データセット・API・レポートに必ず付きます。
disclaimer: >-
  用途地域・区域区分は国土数値情報 A55（都市計画決定情報）の公表値です。
  建築の可否は規模・接道・条例・特定行政庁の判断で変わるため、この情報は
  一次スクリーニングにのみ使用し、建築確認・事前相談の代わりにはしないでください。
