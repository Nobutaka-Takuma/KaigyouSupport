# 地域の位置づけ。**LLM に計算させないもの。**
#
# ---------------------------------------------------------------------------
# なぜこれが要るのか
#
# 「人口 12,430人」だけでは判断できません。多いのか少ないのかが分からない
# からです。percentile は既に measures にありますが、**それを組み合わせた
# 意味は、これまで誰も計算していませんでした。**
#
#   人口：      市街地 上位 8%
#   歯科医院数：市街地 上位 35%
#
# この 2 行から「人口規模に対して歯科医院が相対的に少ない」を読み取るのは、
# これまで LLM の仕事でした。**それは Fact ではなく、LLM の解釈です。**
# 引き算で出るものを LLM にやらせると、検算できない文が 1 つ増えます。
#
# ここで計算して Fact にすれば、LLM はそれを**引用**できます。引用された
# 数字は verify_step1 が実在を確かめます。**GIS が Fact を確定し、LLM は
# それを解釈する**——分業はそこです。
#
# ---------------------------------------------------------------------------
# 重みをここに置く理由
#
# コードに書くと、変えるのに再デプロイが要り、変えた履歴が git log にしか
# 残りません。業態を増やすときも、コードを読まないと何が効いているのかが
# 分かりません。

version: 1

# 評価ロジックの版。データが更新されても、この版で計算した結果を再現できる
# ようにするため（指示書 §19）。**しきい値や軸を変えたら上げてください。**
benchmark_version: v1.0

# どの母集団で位置づけを語るか。**上から順に、使える最初のもの。**
#
# 「県内全メッシュ」で語ると、町の中心はどこでも上位数%に入ります。それは
# 「市街地かどうか」を測っているだけで、開業地の比較になりません。だから
# 市街地（urban）を先に見ます。使えないとき（その県の実測下限が出ないとき）
# だけ順に下ります。
#
# **母集団が違えば同じ数字の意味が変わります。** 位置づけは必ず 1 つの母集団
# で揃えて語り、どれを使ったかをレポートに書きます（指示書 §16）。
prefer_scopes: [urban, neighbourhood, station_front, nearby, with_clinics, prefecture]

# ------------------------------------------------------------------ 評価軸
#
# ランキング → 評価 → 地域の特徴（指示書 §14）。percentile の生の値ではなく、
# 「人口集積：非常に強い」と読める形にします。
#
# measures に複数書いた軸は、取れたものの平均です。**取れなかったものは
# 平均に入れません**（0 として扱うと、データが無いことが「低い」になります）。
axes:
  population_mass:
    label: 人口集積
    measures: [population]
    means: そこに住んでいる人の多さ

  daytime_inflow:
    label: 昼間流入
    measures: [workers]
    means: 働きに来る人の多さ（**通学者・来街者は含みません**）

  supply:
    label: 歯科の供給
    measures: [clinics_per_10k]
    means: 人口あたりの歯科医院の多さ

  cost:
    label: 立地コスト
    measures: [land_price_yen_per_sqm]
    means: 地価の高さ（**賃料ではありません**）

  outlook:
    label: 将来の人口
    measures: [population_growth]
    means: 直近の人口増減率（2015→2020）

# 評価の言葉。percentile をそのまま出しても、読み手は何段階のうちの
# どこかが分かりません。
bands:
  - { at_least: 0.90, label: 非常に高い }
  - { at_least: 0.75, label: 高い }
  - { at_least: 0.40, label: 平均的 }
  - { at_least: 0.25, label: 低い }
  - { at_least: 0.00, label: 非常に低い }

# --------------------------------------------------------------- アンバランス
#
# 指示書 §7・§11。**ある数字に対して、別の数字が多いのか少ないのか。**
#
# 計算は引き算です。同じ母集団の percentile どうしを引きます。母集団が違う
# percentile を引くと、意味のない数字がそれらしい顔で出ます。
#
# threshold は「これ以上離れていたら言う」。0.20 は percentile で 20 ポイント
# です。**小さくすると、誤差を特徴として読ませることになります。**
gaps:
  demand_vs_supply:
    label: 需要と供給
    a: population
    b: clinics_per_10k
    threshold: 0.20
    a_over_b: 人口規模に対して、人口あたりの歯科医院が相対的に**少ない**
    b_over_a: 人口規模に対して、人口あたりの歯科医院が相対的に**多い**
    note: >-
      医院数は施設の数で、ユニット数でも診療実績でもありません。入口の指標です。

  residents_vs_workers:
    label: 住む人と働きに来る人
    a: population
    b: workers
    threshold: 0.20
    a_over_b: 住んでいる人の規模に対して、働きに来る人が相対的に**少ない**
    b_over_a: 住んでいる人の規模に対して、働きに来る人が相対的に**多い**
    note: >-
      従業者数は経済センサスの従業地基準で、**通学者を含みません**。
      大学の門前では、そこにいる人の大半がこの数字に現れないことがあります。

  now_vs_future:
    label: いまと将来
    a: population
    b: population_growth
    threshold: 0.25
    a_over_b: いまの人口規模に対して、人口の増減率が相対的に**低い**
    b_over_a: いまの人口規模に対して、人口の増減率が相対的に**高い**
    note: >-
      増減率は2015→2020の実績です。将来推計ではありません。

  cost_vs_demand:
    label: コストと需要
    a: land_price_yen_per_sqm
    b: population
    threshold: 0.20
    a_over_b: 需要側の規模に対して、地価が相対的に**高い**
    b_over_a: 需要側の規模に対して、地価が相対的に**低い**
    note: >-
      地価は土地の価格で、賃料でも初期投資額でもありません。

# ------------------------------------------------------------------ 地域特性タグ
#
# 開発指示書 §4。**個別指標を LLM に解釈させる前に、システム側で特徴を抽出します。**
#
# 「人口が上位8%、歯科医院が上位35%」を読んで「人口集積地域だが供給は薄い」と
# 言うのは、これまで LLM の仕事でした。**それは解釈であって Fact ではありません。**
# ここで判定すれば Fact になり、LLM の仕事は**タグと根拠を文章にすること**だけに
# なります（指示書 §4 末尾・§9）。
#
# 条件に書けるもの:
#   axis: <軸のキー>          at_least / below（0〜1 の percentile）
#   gap: <ギャップのキー>      at_least / below（符号つき。a − b）
#   station_band_in: [区分]   駅からの距離の区分
#   station_side_at_least / station_side_below   商圏人口が駅側に寄っている割合
#
# **複数付きます。**「人口集積型」かつ「医療供給過密型」かつ「将来人口減少型」は
# 矛盾ではなく、その地域の実態です。
tags:
  - key: population_dense
    label: 人口集積型
    when: { axis: population_mass, at_least: 0.75 }
    means: 住んでいる人が、比較母集団の中で多いほうに入ります。

  - key: population_thin
    label: 人口希薄型
    when: { axis: population_mass, below: 0.25 }
    means: 住んでいる人が、比較母集団の中で少ないほうに入ります。

  - key: daytime_inflow
    label: 昼間人口流入型
    when: { axis: daytime_inflow, at_least: 0.75 }
    means: 働きに来る人が多い場所です（**通学者・来街者は含みません**）。

  - key: workplace_over_home
    label: 業務集積型
    when: { gap: residents_vs_workers, below: -0.20 }
    means: 住んでいる人より、働きに来る人のほうが相対的に厚い場所です。

  - key: supply_dense
    label: 医療供給過密型
    when: { axis: supply, at_least: 0.75 }
    means: 人口あたりの歯科医院が、比較母集団の中で多いほうに入ります。

  - key: supply_thin
    label: 医療供給不足型
    when: { axis: supply, below: 0.25 }
    means: 人口あたりの歯科医院が、比較母集団の中で少ないほうに入ります。

  - key: demand_over_supply
    label: 需要に対して供給が薄い
    when: { gap: demand_vs_supply, at_least: 0.20 }
    means: >-
      人口規模に対して、人口あたりの歯科医院が相対的に少ない。**医院数は
      施設の数で、ユニット数でも診療実績でもありません。**入口の指標です。

  - key: shrinking
    label: 将来人口減少型
    when: { axis: outlook, below: 0.25 }
    means: 直近の人口増減率が、比較母集団の中で低いほうに入ります（2015→2020 の実績）。

  - key: holding
    label: 人口維持型
    when: { axis: outlook, at_least: 0.60 }
    means: 直近の人口増減率が、比較母集団の中で高いほうに入ります。

  - key: expensive
    label: 高地価型
    when: { axis: cost, at_least: 0.75 }
    means: 地価が、比較母集団の中で高いほうに入ります（**賃料ではありません**）。

  - key: station_dependent
    label: 駅依存度高型
    when:
      station_band_in: [駅前, 駅徒歩圏]
      station_side_at_least: 0.58
    means: >-
      駅に近く、かつ商圏の人口が駅の側に寄っています。**距離だけでは決めません**
      ——駅まで近くても人が反対側に住んでいれば、駅は来院動線ではありません。

  - key: station_detached
    label: 駅との関係弱
    when: { station_band_in: [駅近隣, 駅との関係弱] }
    means: 駅の日常動線からは外れた立地です。来院は駅以外の動線が前提になります。

# ------------------------------------------------------------------ 地域タイプ
#
# 指示書 §9。**名称を LLM に決めさせません。** 定量的なルールで決め、
# LLM の仕事はそれを文章にすることです。
#
# 上から順に、条件を全部満たした最初のもの。どれにも当たらなければ
# 「型に当てはまらない」と言います。**無理に名前を付けません。**
region_types:
  - label: 昼間流入型の中心市街地
    when: { daytime_inflow: { at_least: 0.75 }, population_mass: { at_least: 0.60 } }
  - label: 住宅集積型
    when: { population_mass: { at_least: 0.75 }, daytime_inflow: { below: 0.50 } }
  - label: 就業地型（住む人は少ない）
    when: { daytime_inflow: { at_least: 0.75 }, population_mass: { below: 0.50 } }
  - label: 縮小局面の市街地
    when: { population_mass: { at_least: 0.50 }, outlook: { below: 0.25 } }
  - label: 郊外・低密度
    when: { population_mass: { below: 0.40 }, daytime_inflow: { below: 0.40 } }
