# 類似地点ベンチマーク。**「似た土地」と比べるための設定。**
#
# ---------------------------------------------------------------------------
# なぜ percentile だけでは足りないか。
#
# 既存の比較（measures）は「県内のメッシュ分布の中で上位6%」を返します。分布の
# 中の位置は分かりますが、**相手の顔が見えません。** 沼津駅前の医院数を見た人が
# 次に知りたいのは「県内順位」ではなく、**三島や掛川と比べてどうか**です。
# 東京駅前が激戦だとして、それは新宿・池袋・品川と比べても激戦なのか。
#
# だからここでは、**名前のある比較相手**を選んで横に並べます。選び方は 2 つ。
#
#     乗降客数が同規模の駅前   …… 駅前は駅前と比べる
#     商圏人口が同規模の地点   …… 駅の無い土地でも比べられる
#
# 使いみちも 2 つあります。
#
#     1. 同規模の中で**この地点だけ違う軸**を見つける → KSF の種
#     2. 同規模の中で**供給が薄い地点**を見つける     → 候補地の絞り込み
#
# ---------------------------------------------------------------------------
# **しきい値はここ、数え方はコード。** metrics の `column` は mesh_scores の
# 列名で、実装が持つ許可リストに無い名前を書くと起動時に落ちます（黙って
# その指標だけ消えると、比較表が静かに痩せます）。
# ---------------------------------------------------------------------------

version: 1

# 1 つの表に並べる比較相手の数。多いほど分布は安定しますが、読む人が
# 一覧できるのは 5〜6 件です。
count: 5

# **近すぎる地点は比較相手になりません。** 商圏が重なっていると、同じ人口を
# 二度数えて「似ている」と言っているだけになります（東京駅と有楽町駅）。
min_separation_m: 3000

# 「同規模」と呼べる幅。比で持ちます——人口 5 千人の ±3 千人と 5 万人の
# ±3 千人は、同じ幅ではありません。
band:
  low: 0.4          # この地点の 0.4 倍から
  high: 2.5         # 2.5 倍まで
# 実測：東京駅（1,262,604人/日）に対して新宿は 2,713,386 人/日、比で 2.15 倍。
# 2.0 倍で切ると、**読み手がまっ先に思い浮かべる比較相手が「参考」に落ちます。**

# 帯の外の相手も、近い順に埋めます。**ただし表に「参考」と印を付けます。**
# 空の表を出すより、比較可能性を字面で示すほうが読み手に親切です。
fill_outside_band: true

station_scale:
  label: 乗降客数が同規模の駅
  # 駅から遠い地点で「駅前どうしの比較」を出しても意味がありません。
  # 実測：沼津駅の南南西810mの候補地が「駅前」として分析されていました。
  max_station_distance_m: 1200
  # 比較相手の駅前を代表するメッシュは、駅からこの距離以内のものを使います。
  mesh_within_m: 700
  # 規模の近い順に、まずこの数だけ候補を見ます。メッシュを取り込んでいない
  # 県の駅はここで落ちるので、**取り込み済みの県が少ないほど多く要ります。**
  shortlist: 600

population_scale:
  label: 商圏人口が同規模の地点
  # 同じ市区町村から何件も並べても、比較にはなりません。1 市区町村 1 件。
  one_per_area: true
  # **「その軸だけ同規模」を、同規模と呼ばせない守り。**
  #
  # 実測：東京駅前（商圏人口 13,010人）の相手に武蔵村山市と清瀬市が並びました。
  # 住んでいる人の数は同じですが、従業者数は 571,810 対 2,963——193 倍です。
  # 桁が違う相手は表に残したまま「参考」に落とし、統計から外します。
  guards:
    - metric: workers
      max_ratio: 5
      why: 商圏人口が同規模でも、昼間人口が桁違いなら同じ商圏とは呼べません

# 比較する軸。**上から順に表の列になります。**
#
# `share_of` を書くと、その列を分母にした百分率になります（65歳以上人口 ÷
# 商圏人口）。実数のままだと、人口の違う地点どうしで比べられません。
metrics:
  - key: population
    label: 商圏人口
    unit: 人
    column: population
    decimals: 0
  - key: clinics
    label: 歯科医院数
    unit: 件
    column: facility_count
    decimals: 0
  - key: population_per_clinic
    label: 医院1件あたり人口
    unit: 人
    column: population_per_facility
    decimals: 0
    # 「有利な土地を探す」で使う軸。**多い＝供給が薄い**。
    supply_gap: true
    reading:
      high: 医院1件が受け持つ人口が多い（供給が薄い）
      low: 医院1件が受け持つ人口が少ない（供給が厚い）
  - key: age_65_plus_pct
    label: 65歳以上比率
    unit: '%'
    column: age_65_plus
    share_of: population
    decimals: 1
    reading:
      high: 高齢層が厚い
      low: 高齢層が薄い
  - key: age_0_14_pct
    label: 0〜14歳比率
    unit: '%'
    column: age_0_14
    share_of: population
    decimals: 1
    reading:
      high: 子どもが多い
      low: 子どもが少ない
  - key: population_growth_pct
    label: 人口増減率（2015→2020）
    unit: '%'
    column: population_growth
    scale: 100        # 0.043 のような比で入っているので百分率にする
    decimals: 1
    reading:
      high: 直近5年で人口が増えている
      low: 直近5年で人口が減っている
  - key: workers
    label: 従業者数
    unit: 人
    column: workers
    decimals: 0
    reading:
      high: 昼間人口の厚い商圏
      low: 昼間人口の薄い商圏
  - key: daily_passengers
    label: 最寄駅の乗降客数
    unit: 人/日
    column: daily_passengers
    decimals: 0

# この地点が同規模の中で**際立っている**と言える差。中央値からこの割合以上
# 離れていれば、KSF を探す入口として本文に出します。
standout:
  gap_pct: 25       # 実数の軸（人口・件数）は、中央値との比で
  gap_points: 5     # 率の軸（%）は、ポイント差で。9%低い ≠ 1.9ポイント低い
  # 際立っていても、母数が少なければ「際立っている」とは言えません。
  min_peers: 3

# 「より供給が薄い地点」として挙げる差。**これは推奨ではありません。**
# 売上や成功確率の予測はしません——医院1件あたり人口が多いという事実だけです。
supply_gap:
  gap_pct: 20
  max_listed: 3
