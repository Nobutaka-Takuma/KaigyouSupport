# ---------------------------------------------------------------------------
# External data sources.
#
# Nothing in this file is fetched automatically at application start-up: the
# ETL (`kaigyou-etl`) is the only component that touches the network, and the
# web app never does. Each entry is handled by one adapter, and each adapter
# implements download / validate / transform / load as separate steps.
#
# `url` values point at the publishers' documented download endpoints. Those
# endpoints change from time to time (and several of them sit behind a form
# rather than a stable link), so every adapter also accepts a locally supplied
# file:
#
#     kaigyou-etl run mhlw_dental_clinics --input data/raw/tokyo_dental.csv
#
# If a download fails -- blocked network, moved URL, missing credential -- the
# failure is written to `acquisition_runs` with its cause and the affected
# tables are left empty. No placeholder rows are ever inserted in their place.
# ---------------------------------------------------------------------------

defaults:
  # Fallback only. Which prefecture a run is loading is given per run --
  # `load-local <dir> --prefecture 22` -- because the e-Stat mesh files carry
  # no prefecture of their own: tblT001141H22.txt says Shizuoka in its name and
  # nowhere in its contents. Without the flag every file would be tagged 13.
  prefecture_code: "13"          # 13 = 東京都
  timeout_seconds: 120
  user_agent: "KaigyouSupport-ETL/0.1 (+https://github.com/Nobutaka-Takuma/KaigyouSupport)"

sources:

  mhlw_dental_clinics:
    adapter: mhlw_clinics
    name: "医療機能情報提供制度（医療情報ネット）歯科診療所 施設情報"
    publisher: "厚生労働省"
    dataset_kind: official
    homepage_url: "https://www.iryou.teikyouseido.mhlw.go.jp/znk-web/juminkanja/S2400/initialize"
    terms_url: "https://www.iryou.teikyouseido.mhlw.go.jp/znk-web/juminkanja/S9000/riyoukiyaku"
    license: "厚生労働省 医療情報ネット 利用規約に従う"
    # The published bundle is one zip per data category; the dental facility
    # file is `0xx_dental_facility_info_YYYYMMDD.csv`. It is distributed from
    # the page above rather than a stable direct link, so the usual route is:
    #
    #   kaigyou-etl run mhlw_dental_clinics --input <downloaded>.csv
    #
    # Leave `url` unset rather than guessing: a wrong URL produces a
    # download failure that looks like an outage instead of a config gap.
    url: null
    encoding: utf-8-sig
    facility_category: dental_clinic
    source_date: 2026-06-01
    # The file covers all 47 prefectures. Set this to restrict the load; leave
    # it unset to store the whole country (the schema is prefecture-agnostic).
    prefecture_filter: null
    # Column mapping. Publishers rename headers between releases; adjust here
    # rather than in code. Each entry lists the header candidates to try.
    columns:
      facility_id:       ["ID", "医療機関コード", "医療機関ID"]
      name:              ["正式名称", "医療機関名称", "名称"]
      address:           ["所在地", "住所", "医療機関所在地"]
      lat:               ["所在地座標（緯度）", "緯度", "latitude"]
      lng:               ["所在地座標（経度）", "経度", "longitude"]
      prefecture_code:   ["都道府県コード"]
      # 3-digit municipality part; combined with the prefecture code to form
      # the 5-digit JIS X0402 code.
      municipality_code: ["市区町村コード", "自治体コード"]
      # Present in some releases / companion files, absent in others. Optional.
      opening_date:      ["開設年月日", "開設日"]
      clinic_types:      ["診療科目", "標榜診療科"]
      founder_type:      ["開設者区分", "開設者"]
    # Extra published fields kept verbatim in facilities.attributes (jsonb).
    # Unknown keys are ignored, so a release that drops one still loads.
    attribute_columns:
      homepage:      "案内用ホームページアドレス"
      name_kana:     "正式名称（フリガナ）"
      short_name:    "略称"
      closed_mon:    "毎週決まった曜日に休診（月）"
      closed_tue:    "毎週決まった曜日に休診（火）"
      closed_wed:    "毎週決まった曜日に休診（水）"
      closed_thu:    "毎週決まった曜日に休診（木）"
      closed_fri:    "毎週決まった曜日に休診（金）"
      closed_sat:    "毎週決まった曜日に休診（土）"
      closed_sun:    "毎週決まった曜日に休診（日）"
      closed_holiday: "祝日に休診"

  mhlw_dental_specialties:
    adapter: mhlw_specialties
    name: "医療機能情報提供制度（医療情報ネット）歯科 診療科目・診療時間"
    publisher: "厚生労働省"
    dataset_kind: official
    homepage_url: "https://www.iryou.teikyouseido.mhlw.go.jp/znk-web/juminkanja/S2400/initialize"
    terms_url: "https://www.iryou.teikyouseido.mhlw.go.jp/znk-web/juminkanja/S9000/riyoukiyaku"
    license: "厚生労働省 医療情報ネット 利用規約に従う"
    # Companion file to `mhlw_dental_clinics`, published from the same page as
    # `0xx_dental_speciality_hours_YYYYMMDD.csv`. It has no coordinates and no
    # names: it is one row per (施設, 診療科目, 診療時間帯 1-3), joined back to
    # the facility file on ID.
    #
    #   kaigyou-etl run mhlw_dental_specialties --input <downloaded>.csv
    #
    url: null
    encoding: utf-8-sig
    facility_category: dental_clinic
    source_date: 2026-06-01
    columns:
      facility_id:    ["ID", "医療機関コード", "医療機関ID"]
      specialty_code: ["診療科目コード"]
      specialty_name: ["診療科目名"]
      time_band:      ["診療時間帯"]

    # ---------------------------------------------------------------- 診療科目
    # 標榜診療科目コードは告示に基づく固定値。名称ではなくコードで正規化するのは、
    # 名称は表記ゆれ（「歯科口腔外科」「口腔外科」）があるため。
    #
    # 08991（その他）だけは自由記載で、インプラント・審美・訪問などはここにしか
    # 現れません。書いた医院しか数えられないので、この区分から作られたキーは
    # is_free_text = true として区別し、既定のスコアには使いません。
    specialty_codes:
      "08001": general                 # 歯科
      "08002": orthodontics            # 矯正歯科
      "08003": oral_surgery            # 歯科口腔外科
      "08004": pediatric               # 小児歯科
      "08005": pediatric_orthodontics  # 小児矯正歯科
    #: この区分は自由記載。下のキーワードで正規化し、当たらないものは other に。
    free_text_code: "08991"
    free_text_keywords:
      implant:         ["インプラント"]
      cosmetic:        ["審美", "ホワイトニング", "美容歯科"]
      home_visit:      ["訪問"]
      periodontal:     ["歯周病", "歯周治療", "ペリオ"]
      preventive:      ["予防歯科", "予防"]
      special_needs:   ["障害者歯科", "障がい者歯科", "スペシャルニーズ"]
      dental_anesthesia: ["歯科麻酔"]
      prosthodontics:  ["補綴", "義歯", "入れ歯"]
      endodontics:     ["歯内療法", "根管治療"]
      sleep_apnea:     ["睡眠時無呼吸", "いびき"]
      general:         ["一般歯科"]
      orthodontics:    ["矯正"]
      oral_surgery:    ["口腔外科"]
      pediatric:       ["小児歯科", "こども歯科", "小児"]
    #: 歯科以外の標榜科（内科・皮膚科など。歯科口腔外科を併設する病院に出る）。
    #: 歯科の競合数には混ぜず、この 1 つのキーにまとめます。
    non_dental_key: other_medical

    # ---------------------------------------------------------------- 診療時間
    # 曜日 8 種 × 診療時間帯 3 種 × (診療/外来受付) の開始・終了。
    # 列名は「月_診療開始時間」のように接頭辞＋接尾辞で決まっているので、
    # 一覧を書き並べずにテンプレートで解決します。
    weekday_prefixes:
      "1": "月"
      "2": "火"
      "3": "水"
      "4": "木"
      "5": "金"
      "6": "土"
      "7": "日"
      "8": "祝"
    hour_columns:
      opens:             "{day}_診療開始時間"
      closes:            "{day}_診療終了時間"
      reception_opens:   "{day}_外来受付開始時間"
      reception_closes:  "{day}_外来受付終了時間"
    #: 「夜間も開いている」と数える終了時刻。競合の営業時間の差を見るための
    #: 便宜的な区切りで、法令上の定義ではありません。
    evening_from: "18:30"

  estat_population_mesh:
    adapter: estat_mesh
    name: "国勢調査 500mメッシュ 人口・世帯（2020年）"
    publisher: "総務省統計局 / e-Stat 統計GIS"
    dataset_kind: official
    homepage_url: "https://www.e-stat.go.jp/gis/statmap-search?type=1"
    license: "政府統計の総合窓口（e-Stat）利用規約 / CC BY 4.0 相当"
    # Distributed from the 統計GIS search form as `tblTxxxxxxHnn.txt` (Shift-JIS,
    # a Japanese label row under the header). Like the clinic file it has no
    # stable direct link, so the normal route is:
    #
    #   kaigyou-etl run estat_population_mesh \
    #       --input  tblT001141H13.txt \
    #       --baseline tblT000847H13.txt
    #
    url: null
    encoding: cp932
    source_date: 2020-10-01
    # Mesh resolution is NOT set here: it is derived from the length of
    # KEY_CODE (8 digits = 1km, 9 = 500m, 10 = 250m) and stored per row, so
    # swapping resolutions is a matter of loading a different file.
    columns:
      mesh_code:   ["KEY_CODE", "MESH_ID", "メッシュコード"]
      population:  ["T001141001", "T000876001", "人口総数"]
      age_0_14:    ["T001141004", "T000876020", "総数0～14歳"]
      age_15_64:   ["T001141010", "T000876021", "総数15～64歳"]
      age_65_plus: ["T001141019", "T000876022", "総数65歳以上"]
      households:  ["T001141034", "T000876023", "世帯総数"]
    # Suppression bookkeeping columns. Values are counted during validate and
    # reported; the published figures are loaded as-is rather than being
    # "un-suppressed", which would mean inventing numbers.
    suppression_columns:
      flag: "HTKSYORI"
      moved_to: "HTKSAKI"
      merged_from: "GASSAN"
    # Prior census round, used only to derive population_growth. Its column
    # ids differ from the current round (65歳以上 is 019 in 2020 but 016 in
    # 2015), so it carries its own mapping.
    growth_baseline:
      name: "国勢調査 500mメッシュ 人口（2015年）"
      source_date: 2015-10-01
      years: 5
      encoding: cp932
      columns:
        mesh_code:  ["KEY_CODE"]
        population: ["T000847001", "人口総数"]

  estat_business_mesh:
    adapter: estat_business_mesh
    name: "経済センサス 500mメッシュ 事業所数・従業者数"
    publisher: "総務省統計局・経済産業省 / e-Stat 統計GIS"
    dataset_kind: official
    homepage_url: "https://www.e-stat.go.jp/gis/statmap-search?type=1"
    license: "政府統計の総合窓口（e-Stat）利用規約 / CC BY 4.0 相当"
    # Same 統計GIS form as the population mesh, same file shape:
    #
    #   kaigyou-etl run estat_business_mesh --input tblT001147H13.txt
    #
    url: null
    encoding: cp932
    # CHECK THIS against the e-Stat download page you used. It is displayed to
    # the reader as the survey date, so a wrong value here is a wrong claim on
    # screen -- and the file itself carries no year.
    source_date: 2021-06-01
    # The table publishes the same 21 industry labels twice: establishments
    # first, then the people working in them. Nothing in the file distinguishes
    # them, so the column ids do. `validate` rejects a load where workers per
    # establishment falls below one, which is what a swap looks like.
    columns:
      mesh_code:      ["KEY_CODE", "MESH_ID", "メッシュコード"]
      establishments: ["T001147001"]          # Ａ～Ｓ全産業 事業所数
      workers:        ["T001147022"]          # Ａ～Ｓ全産業 従業者数
    # Divisions worth keeping per mesh. Not all 21: these are the ones that say
    # something about who is on the street during the day. Stored as jsonb, not
    # scored -- the MVP scores on the all-industry total only.
    industry_columns:
      secondary:          ["T001147003", "T001147024"]   # Ｃ～Ｅ 第2次産業
      tertiary:           ["T001147007", "T001147028"]   # Ｆ～Ｓ 第3次産業
      wholesale_retail:   ["T001147011", "T001147032"]   # Ｉ 卸売業，小売業
      accommodation_food: ["T001147015", "T001147036"]   # Ｍ 宿泊業，飲食サービス業
      education:          ["T001147017", "T001147038"]   # Ｏ 教育，学習支援業
      health_welfare:     ["T001147018", "T001147039"]   # Ｐ 医療，福祉

  mlit_stations:
    adapter: mlit_stations
    name: "国土数値情報 駅別乗降客数（S12）"
    publisher: "国土交通省"
    dataset_kind: official
    homepage_url: "https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-S12.html"
    license: "国土数値情報 利用約款"
    url: "https://nlftp.mlit.go.jp/ksj/gml/data/S12/S12-25/S12-25_GML.zip"
    source_date: 2025-01-01
    # The zip ships the same shapefile twice, under Shift-JIS/ and UTF-8/.
    # Preference order; the first directory present wins.
    archive_variants:
      - { path: "UTF-8", encoding: "utf-8" }
      - { path: "Shift-JIS", encoding: "cp932" }
    columns:
      station_id:   ["S12_001c"]           # stationCode
      group_id:     ["S12_001g"]           # groupCode -- same station, any operator
      name:         ["S12_001"]
      operator:     ["S12_002"]
      railway_line: ["S12_003"]

    # Passenger counts are published as one four-column block per survey year:
    #   duplicate, dataEorN, remarks, passengers
    # starting at S12_006 / S12_009 for 2011 and advancing by 4 each year
    # (so 2024 is S12_058 / S12_061). Bump last_year when a new edition ships;
    # years whose columns are absent from the file are skipped and reported.
    passenger_series:
      first_year: 2011
      last_year: 2024
      column_template: "S12_{index:03d}"
      duplicate_start: 6
      passengers_start: 9
      stride: 4
      # Only rows flagged 1 carry the figure. Rows flagged 2 are the same
      # operator's other entries for the station and are published as 0 --
      # counting them as "no data" would silently drop real passengers.
      primary_duplicate_code: "1"

    # A large interchange is published as several rows, one per operator, each
    # with its own count. Reporting only the nearest row would describe
    # Shinjuku by its Metro entrance alone (200k/day) rather than the station
    # (2.7M/day), so rows sharing a group are combined into one station.
    # S12 publishes no prefecture. It is taken from the nearest loaded mesh
    # within this distance; beyond it the column is left NULL rather than
    # guessed.
    prefecture_match_radius_m: 3000

    grouping:
      enabled: true
      # Guard against a blank or reused group code tying together stations that
      # are nowhere near each other: beyond this spread, fall back to the
      # per-operator station code.
      max_spread_m: 2000

  mlit_municipalities:
    adapter: mlit_municipalities
    name: "国土数値情報 行政区域（N03）"
    publisher: "国土交通省"
    dataset_kind: official
    homepage_url: "https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-N03-v3_1.html"
    license: "国土数値情報 利用約款"
    url: "https://nlftp.mlit.go.jp/ksj/gml/data/N03/N03-2024/N03-20240101_13_GML.zip"
    source_date: 2024-01-01
    # N03 ships flat with a .cpg declaring UTF-8. The adapter reads that
    # declaration rather than assuming Shift-JIS like the older layers.
    columns:
      prefecture_name:   ["N03_001"]
      district_name:     ["N03_003"]          # 郡/政令市。多くの行で空
      municipality_name: ["N03_004", "N03_003"]
      municipality_code: ["N03_007"]

    # Codes ending in 000 are the prefecture-level catch-all (13000 東京都
    # 所属未定地 -- reclaimed land and water whose municipality is not settled).
    # It is not a municipality, and letting it through would label meshes with
    # an area name that does not exist.
    exclude_code_suffixes: ["000"]

  mlit_land_prices:
    adapter: mlit_land_prices
    name: "国土数値情報 地価公示（L01）標準地"
    publisher: "国土交通省"
    dataset_kind: official
    homepage_url: "https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-L01-v3_1.html"
    license: "国土数値情報 利用約款に従う（出典明記）"
    # Published per prefecture per year as L01-<yy>_<pref>_GML.zip. Distributed
    # from the page above; the usual route is:
    #
    #   kaigyou-etl run mlit_land_prices --input L01-26_13_GML.zip
    #
    url: null
    encoding: cp932
    # 価格時点は毎年1月1日。The file name carries the year (L01-26 = 令和8年);
    # this is the date shown to the reader as the survey date.
    source_date: 2026-01-01
    # The columns are L01_001..L01_148 and nothing in the file says what any of
    # them mean. This mapping is the documentation.
    columns:
      municipality_code: ["L01_001"]      # 市区町村コード
      use_category:      ["L01_002"]      # 用途区分
      serial:            ["L01_003"]      # 連番
      year:              ["L01_007"]      # 価格時点の年
      price:             ["L01_008"]      # 円/m²
      change_rate:       ["L01_009"]      # 対前年変動率（%）
      municipality_name: ["L01_024"]
      address:           ["L01_025"]
      current_use:       ["L01_028"]      # 利用の現況
      nearest_station:   ["L01_048"]
      station_distance:  ["L01_050"]      # m
      zoning:            ["L01_051"]      # 用途地域
      building_coverage: ["L01_057"]      # 建蔽率 %
      floor_area_ratio:  ["L01_058"]      # 容積率 %
    # 用途区分の公表コード。Residential and commercial land in the same ward
    # differ by a factor of three or more, so one blended "land price here"
    # would describe neither. Unlisted codes load with a null label rather than
    # being dropped -- the price is still real.
    use_categories:
      "000": "住宅地"
      "003": "宅地見込地"
      "005": "商業地"
      "007": "準工業地"
      "009": "工業地"
      "010": "市街化調整区域内宅地"
      "013": "林地"

  # ---------------------------------------------------------------------------
  # 500m メッシュ別将来推計人口。
  #
  # 総合スコアの 20% を占める「成長」が 2015→2020 の実績だけで決まっていた
  # ので、その埋め合わせです。歯科の開業は 20〜30 年の意思決定で、過去 5 年の
  # 増減はその代理として弱い。
  #
  #   kaigyou-etl run mlit_future_population --input 500m_mesh_suikei_2018_shape_22.zip
  #
  # **属性名はこの版に合わせてください。** 国土数値情報のメッシュ系ファイルは
  # 推計の版で属性名が変わります。合わないときは、実際の属性名を並べて
  # 落とすようにしてあります（黙って 0 件にはしません）。
  mlit_future_population:
    adapter: mlit_future_population
    name: 国土数値情報 500mメッシュ別将来推計人口
    publisher: 国土交通省
    dataset_kind: official
    homepage_url: https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-mesh500h30.html
    license: 国土数値情報 利用約款
    notes: "社人研の推計を 500m メッシュに按分したもの。推計であって予測ではない。"
    mesh_size_m: 500
    # 推計の基準年。レポートで「いま比べて何割か」を出すのに使います。
    base_year: 2020
    # 公表されている推計の名前をそのまま。こちらで言い換えると出典を辿れません。
    estimate_label: "平成30年国政局推計（500mメッシュ別将来推計人口）"
    shapefile_member: "500m_mesh"
    encoding: cp932
    columns:
      mesh_code: ["MESH_ID", "MESH_CODE", "KEY_CODE", "MESHCODE"]
    # 年ごとの属性名の雛形。{year} が置き換わります。
    year_fields:
      population:  "PTN_{year}"
      age_0_14:    "PTA_{year}"
      age_15_64:   "PTB_{year}"
      age_65_plus: "PTC_{year}"
    years: [2020, 2025, 2030, 2035, 2040, 2045, 2050]

  osm_walk_network:
    adapter: osm_walk_network
    name: "OpenStreetMap 道路データ（徒歩ネットワーク）"
    publisher: "OpenStreetMap contributors / Geofabrik GmbH"
    dataset_kind: official
    homepage_url: "https://download.geofabrik.de/asia/japan.html"
    # ODbL. Attribution is a licence condition, not a courtesy: the app shows
    # this wherever a walking catchment is used.
    license: "Open Database License (ODbL) 1.0 / (c) OpenStreetMap contributors"
    terms_url: "https://www.openstreetmap.org/copyright"
    notes: "Geofabrik の .shp.zip（例 kanto-latest-free.shp.zip）に含まれる道路レイヤ gis_osm_roads を使用。"
    #   kaigyou-etl run osm_walk_network --input kanto-latest-free.shp.zip
    url: null
    # Geofabrik ships this layer as UTF-8, unlike the Japanese government data.
    encoding: utf-8
    source_date: null
    # Several layers share the archive; this picks the roads one.
    shapefile_member: "gis_osm_roads"
    columns:
      road_class: ["fclass", "highway", "type"]
      osm_id:     ["osm_id", "id"]
      name:       ["name"]
    # Which OSM highway classes a person may walk along. Motorways and trunk
    # roads are absent on purpose: pedestrians are prohibited on them in Japan,
    # so routing through one would invent a catchment nobody can reach.
    walkable_classes:
      - footway
      - path
      - pedestrian
      - steps
      - living_street
      - residential
      - service
      - unclassified
      - track
      - cycleway
      - tertiary
      - tertiary_link
      - secondary
      - secondary_link
      - primary
      - primary_link
    # Clip to the area being analysed. A Kanto extract is several times larger
    # than Tokyo, and every edge outside it slows every search.
    # (min_lng, min_lat, max_lng, max_lat). Start narrow: noding a network is
    # the slow step and it grows with the square of nothing helpful. Widen once
    # a run has completed and the size is known.
    #   23 wards        [139.56, 35.53, 139.92, 35.82]
    #   Tokyo mainland  [138.90, 35.45, 139.95, 35.90]
    # Outside the box there is no network, so `walk` falls back to a circle --
    # which the analysis reports rather than hides.
    bbox: [139.56, 35.53, 139.92, 35.82]
    # Endpoint-matching tolerance in degrees for pgr_createTopology.
    # 0.00001 deg is about 1.1 m at this latitude.
    topology_tolerance_deg: 0.00001
